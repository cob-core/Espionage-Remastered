 # v4.0 Ensemble naval — événements
 adv_dip_event.140.t: "Le réseau prend forme"
 adv_dip_event.140.d: "Notre service de renseignement a repéré les premières fissures dans l'amirauté de [SCOPE.sCountry('naval_intel_target').GetName] — un commis endetté, un officier des transmissions écarté, une salle des cartes restée ouverte. Un réseau patient pourrait transformer ces fissures en brèche."
 adv_dip_event.140.f: "Le dossier était mince, mais prometteur. \n\n« Leur établissement naval se croit impénétrable, expliqua le directeur du renseignement. Cette confiance même est notre ouverture. Personne ne surveille l'homme qui surveille le port. » \n\nDonner notre accord nous engagerait pour des mois — des années peut-être — de patiente approche, avec des fonds versés à des informateurs dont nous ne connaîtrions jamais les noms. Mais au bout de cette route : leurs codes, leurs cartes, leur flotte mise à nu."
 adv_dip_event.140.a: "Commencez l'infiltration."
 adv_dip_event.141.t: "Le commis de l'arsenal"
 adv_dip_event.141.d: "Un jeune commis des chantiers navals de la cible a commencé à nous transmettre des calendriers de réquisition — menu fretin, mais chaque document précise un peu mieux la carte du port."
 adv_dip_event.141.f: "Il demandait si peu — l'effacement de ses dettes de jeu, rien de plus. En échange : les plans de mouillage, les allocations de charbon, le rythme quotidien d'une flotte à l'ancre. \n\nAucune page ne comptait à elle seule. Ensemble, elles formaient un portrait."
 adv_dip_event.141.a: "Les petits ruisseaux font les grandes rivières."
 adv_dip_event.142.t: "L'interception des transmissions"
 adv_dip_event.142.d: "Nos agents ont obtenu des copies partielles du code de signaux de la cible. Les exploiter sans retenue accélérerait l'infiltration — mais les officiers des transmissions remarquent quand leurs codes fuient."
 adv_dip_event.142.f: "Trois pages, photographiées à la lampe dans une chambre d'hôtel pendant que leur courrier cuvait une soirée soigneusement financée. \n\n« Nous pouvons lire peut-être un tiers de leur trafic courant, estima le cryptographe. Si nous agissons d'après ce que nous lisons, ils finiront par déduire la fuite. Si nous nous contentons d'écouter, nous apprendrons plus lentement — mais ils ne soupçonneront rien. »"
 adv_dip_event.142.a: "Exploitez-les sans retenue."
 adv_dip_event.142.b: "Écoutez en silence."
 adv_dip_event.143.t: "Le valet de l'amiral"
 adv_dip_event.143.d: "Une occasion rare : un valet de la maison de l'état-major naval est prêt à photographier les documents de la boîte à dépêches de son maître — pour un prix, et au péril de sa vie."
 adv_dip_event.143.f: "« La boîte à dépêches reste ouverte une dizaine de minutes chaque soir pendant que l'amiral s'habille pour dîner, rapporta le recruteur. Le valet est consentant. Il est aussi terrifié, et les hommes terrifiés commettent des erreurs. » \n\nLe butin pourrait être extraordinaire — dispositions de la flotte, plans de guerre, procès-verbaux de l'état-major naval lui-même. Le risque qu'une main tremblante renverse une lampe l'était tout autant."
 adv_dip_event.143.a: "Le jeu en vaut la chandelle."
 adv_dip_event.143.b: "Trop dangereux."
 adv_dip_event.144.t: "Rafle du contre-espionnage"
 adv_dip_event.144.d: "Le contre-espionnage naval de la cible a commencé à interroger le personnel des chantiers. Notre réseau retient son souffle."
 adv_dip_event.144.f: "Les interrogatoires étaient méthodiques : chaque commis aux chaussures neuves, chaque officier dont la note de mess dépassait la solde. \n\n« Ils n'ont encore aucun nom, écrivit notre chef de station. Mais ils savent que quelqu'un est à l'intérieur. Nous pouvons tenir bon et espérer, ou nous terrer et perdre des mois de travail. »"
 adv_dip_event.144.a: "Tenez bon."
 adv_dip_event.144.b: "Terrez-vous."
 adv_dip_event.145.t: "L'attaché ivre"
 adv_dip_event.145.d: "Un de nos propres attachés navals, bien avancé dans ses coupes lors d'un dîner de légation, s'est vanté de connaître les mouvements de la flotte ciblée. Leur contre-espionnage écoutait."
 adv_dip_event.145.f: "Le toast de trop. Au matin, l'attaché ne se souvenait que de fragments de la soirée ; le service de renseignement de la cible, hélas, avait transcrit le reste. \n\nLe rappel et la disgrâce de l'imbécile allaient de soi. La question plus épineuse était de savoir quelle part du réseau sa vanité avait éclairée."
 adv_dip_event.145.a: "Rappelez l'imbécile."
 adv_dip_event.146.t: "Le photographe du port"
 adv_dip_event.146.d: "Un photographe commercial dont l'atelier domine le mouillage naval de la cible accepte de nous vendre ses « études de paysage » — et leur flotte figure dans chaque cliché."
 adv_dip_event.146.f: "Officiellement, il photographiait des couchers de soleil. Que son balcon dominât le bassin d'armement, et que ses couchers de soleil saisissent chaque coque neuve à son mouillage, n'était que coïncidence artistique. \n\nSes prix étaient élevés pour des paysages. Pour de la photographie de flotte, c'était une aubaine — encore qu'un homme qui vend à un acheteur finisse par vendre à deux."
 adv_dip_event.146.a: "Achetez la collection."
 adv_dip_event.148.t: "Le réseau frappe"
 adv_dip_event.148.d: "Des années de travail patient au sein de l'amirauté de [SCOPE.sCountry('naval_intel_target').GetName] portent leurs fruits. Le réseau attend son ultime instruction — et il n'y aura de temps que pour un seul coup avant l'inévitable démantèlement."
 adv_dip_event.148.f: "Le directeur du renseignement posa trois dossiers sur le bureau. \n\n« Le bureau du chiffre : leurs codes de signaux, à portée de main. Le navire amiral : nos gens font partie de son équipage d'armement. Le bureau hydrographique : chaque sonde et chaque batterie côtière de leur littoral, prêtes à être copiées. » \n\n« Choisissez, monsieur. Le réseau peut livrer l'un des trois. Le temps qu'ils remontent à la source, nos gens auront disparu. »"
 adv_dip_event.148.a: "Prenez leurs codes de signaux."
 adv_dip_event.148.b: "Estropiez leur navire amiral."
 adv_dip_event.148.c: "Copiez les levés côtiers."
 adv_dip_event.149.t: "Le réseau se défait"
 adv_dip_event.149.d: "Désastre. Le contre-espionnage de [SCOPE.sCountry('naval_intel_target').GetName] a démantelé notre réseau — arrestations aux portes de l'arsenal, informateurs traînés devant les tribunaux, et notre nom dans tous les journaux étrangers."
 adv_dip_event.149.f: "Tout commença par une arrestation — le commis de l'arsenal, cueilli discrètement à son logis. À la fin de la semaine, les arrestations se comptaient par quarantaines, et les procès commencèrent. \n\nChaque informateur ne connaissait que des fragments, mais les fragments s'assemblaient en un tout sans équivoque, et ce tout nous désignait sans équivoque. Notre ambassadeur endura la convocation avec toute la dignité possible. \n\nLe réseau qui avait demandé des années fut défait en neuf jours."
 adv_dip_event.149.a: "Un désastre."
