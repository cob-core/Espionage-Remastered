 # v4.1 textes d'ambiance
 adv_dip_event.150.f: "Le rapport du capitaine de port fut lu à huis clos. Le vapeur battait pavillon neutre et transportait du grain, selon ses papiers. Sous le grain, des caisses de fusils dont notre arsenal avait mal effacé les numéros de série.\n\nLe capitaine et l'équipage sont détenus dans un port étranger. Leur silence est payé, mais la cargaison parle d'elle-même."
 adv_dip_event.151.f: "Le tribunal des prises a tout catalogué : fusils, obus, bottes, et un registre que les contrebandiers auraient dû brûler.\n\n« Des paiements tirés sur des comptes que nous avons identifiés, rapporta l'officier de renseignement. Des ordres d'acheminement dans un chiffre percé au printemps dernier. Aucun doute sur l'expéditeur. » Le ministre referma le dossier et fit convoquer l'ambassadeur."
 adv_dip_event.152.f: "L'ambassadeur ne s'assit pas. Il posa sur le bureau une photographie des manifestes saisis et lut une déclaration préparée, d'une voix égale.\n\nSon gouvernement exigeait une renonciation publique aux livraisons, la publication de l'ordre dans notre propre presse, et la fin de tout trafic sous un mois. L'alternative resta soigneusement tue."
 adv_dip_event.153.f: "Le défilé de la victoire passa sous des fenêtres que nous avions payées, devant des canons que nous avions expédiés, et la foule n'en sut rien.\n\nLeur chancelier le sait. Sa première lettre privée après l'armistice nous remerciait en des termes qui ne seront jamais publiés, et promettait que la dette ne serait pas oubliée."
 adv_dip_event.160.f: "Les rapports du chef de station arrivent à l'heure, de la même écriture régulière. Les paiements passent. Les sources répondent à toutes nos questions.\n\n« Voilà le problème, dit l'officier de revue. Aucune source n'est fiable à ce point. Ou bien nous avons le meilleur réseau du monde, ou bien quelqu'un d'autre écrit leurs réponses. »"
 adv_dip_event.161.f: "L'équipe d'audit remonta trois années de rapports et trouva la couture : un chiffre douanier fidèlement rapporté par nos agents, que les registres publiés du port contredisaient.\n\nTout rapport postérieur à cette date est désormais présumé dicté. Le bureau qui célébrait ces rapports doit maintenant calculer ce qui fut livré en échange."
 adv_dip_event.163.f: "Le courrier livra l'enveloppe habituelle par la voie habituelle. Comptes de solde, résumés de réquisition, une note sur le moral des garnisons du sud.\n\nElle fut lue, classée et transmise à l'état-major, qui n'y trouva rien à redire."
 adv_dip_event.165.f: "Il n'y eut ni annonce ni cérémonie. La reconnaissance vint par de plus petits signes : un service rival qui double discrètement son budget de contre-espionnage, un ambassadeur qui choisit mieux ses conversations de table, un commis au chiffre qui travaille désormais derrière deux portes verrouillées.\n\nTous sont parvenus à la même conclusion à notre sujet."
 adv_dip_event.166.f: "Nos chefs de station rapportent le même schéma depuis trois capitales. Des sources qui se taisent. Des boîtes aux lettres mortes laissées intactes. Un transfuge qui s'est ravisé au dernier moment.\n\nQuelqu'un d'autre paie mieux, va plus vite, et pose nos questions avant nous."
 adv_dip_event.170.f: "Le wagon fut attelé à l'express de nuit, stores tirés, porte scellée par un douanier payé pour sceller et ne rien demander.\n\nÀ l'intérieur, le passager lisait sous une lampe voilée et annotait les marges d'une brochure interdite dans le pays où il retourne."
 adv_dip_event.171.f: "Le premier discours fut prononcé dans une salle louée au-dessus d'une imprimerie, devant quarante personnes. Le deuxième remplit un entrepôt.\n\nLa police dispersa la troisième réunion, ce qui était le but recherché. La nouvelle du mandat d'arrêt fit plus pour l'affluence que n'importe quelle brochure."
 adv_dip_event.172.f: "L'inspecteur des frontières se méfia d'un passeport trop neuf pour l'homme qui le portait. Le wagon scellé fut ouvert sur une voie de garage, sous bonne garde.\n\nLe prisonnier donna un faux nom, puis un second, puis se tut. Les journaux furent moins discrets. À la fin de la semaine, toutes les sociétés loyalistes du pays avaient tenu un rassemblement contre la subversion étrangère."
 adv_dip_event.175.f: "Chaque fil fut suivi jusqu'au bout : les traites bancaires, les permis contrefaits, le bail du refuge signé par un commis consulaire.\n\nTous aboutissent à la même capitale. Les enquêteurs présentèrent leurs conclusions avec une satisfaction professionnelle, sans savoir qu'ils lisaient un scénario écrit pour eux."
 adv_dip_event.176.f: "Une seule erreur défit tout l'édifice. Une traite contrefaite portait le filigrane d'une papeterie incendiée deux ans avant la date qu'elle affichait.\n\nDe ce seul fil, toute la fabrication se dénoua, et au bout se tenait le véritable auteur, démasqué devant ses deux victimes à la fois."
 adv_dip_event.180.f: "Le dossier est une simple chemise nouée d'une ficelle. À l'intérieur : des photographies, un registre d'hôtel, quatre billets à ordre, et une lettre que son auteur paierait n'importe quel prix pour récupérer.\n\nIl repose dans un tiroir fermé à clef pendant que nous décidons de sa valeur."
 adv_dip_event.181.f: "L'affaire embrasa les journaux d'une saison puis, comme toutes les affaires, fut remplacée par un scandale plus frais.\n\nLes cercles d'officiers le réadmirent. Son commandement lui fut rendu avec une discrétion qui épargna tout le monde. Seuls ses créanciers se souviennent des détails."
 # Financer la traite clandestine
