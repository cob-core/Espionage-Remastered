 false_flag_directive: "Directive sous fausse bannière"
 false_flag_directive_desc: "#header $false_flag_directive$#!\n$TOOLTIP_DELIMITER$\nFaites porter les empreintes de nos opérations par un bouc émissaire : si nos agents sont pris, les preuves désigneront le pays ciblé. Coûteux, et catastrophique si la supercherie se défait."
