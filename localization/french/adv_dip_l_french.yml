 adv_dip_event.200.t: "Une question de personnel"
 adv_dip_event.200.d_sow_discontent: "La campagne de troubles que nous préparons en [SCOPE.sCountry('spy_target_country').GetName] exigera une main sûre sur place - quelqu'un pour trouver les griefs, financer les pamphlets et rester invisible."
 adv_dip_event.200.d_support_nationalists: "Notre soutien aux nationalistes de [SCOPE.sCountry('spy_target_country').GetName] doit passer par un seul intermédiaire de confiance. Argent, armes et promesses exigent un messager introuvable."
 adv_dip_event.200.d_agitate_for_liberty: "Quelqu'un doit porter nos encouragements aux libéraux de [SCOPE.sCountry('spy_target_country').GetName] - et être oublié de tous ceux qu'il rencontre."
 adv_dip_event.200.d_steal_technology: "Les secrets techniques de [SCOPE.sCountry('spy_target_country').GetName] ne se photographieront pas seuls. Cette mission demande de la patience, des accès, et une excellente mémoire."
 adv_dip_event.200.d_sabotage_recruitment: "Les sergents recruteurs s'achètent, les registres se perdent, les dépôts brûlent. Quelqu'un doit arranger les trois en [SCOPE.sCountry('spy_target_country').GetName] sans jamais être vu."
 adv_dip_event.200.d_election_interference: "Les élections en [SCOPE.sCountry('spy_target_country').GetName] sont un marché comme un autre, et nous comptons y acheter discrètement. Qui tiendra notre bourse là-bas ?"
 adv_dip_event.200.d_steal_commander: "Quelque part en [SCOPE.sCountry('spy_target_country').GetName] sert un officier qui vaut plus pour nous que pour eux. L'approche doit être faite avec soin, et par une seule personne."
 adv_dip_event.200.d_clandestine_arms_pipeline: "Caisses mal étiquetées, manifestes réécrits, gardes-frontières persuadés - une filière vers [SCOPE.sCountry('spy_target_country').GetName] exige un intendant sans existence officielle."
 adv_dip_event.200.d_fund_black_market_slavery: "Les trafiquants qui approvisionnent [SCOPE.sCountry('spy_target_country').GetName] ne traitent qu'en personne. Si nous voulons les financer, quelqu'un doit s'asseoir à cette table."
 adv_dip_event.200.d_support_slaves: "Guides, refuges et faux papiers le long des routes d'évasion de [SCOPE.sCountry('spy_target_country').GetName] - le réseau existe, mais il lui faut un organisateur qui sache se taire."
 adv_dip_event.200.d_naval_intelligence: "Cartes des ports, essais d'artillerie, humeurs des amiraux - tout ce que [SCOPE.sCountry('spy_target_country').GetName] sait de sa propre flotte, nous entendons le savoir aussi. Qui bâtit le réseau ?"
 adv_dip_event.200.d_sealed_train: "Un révolutionnaire, un wagon plombé, et une frontière qui doit s'ouvrir au bon moment. L'escorte de ce voyage vers [SCOPE.sCountry('spy_target_country').GetName] ne peut être choisie à la légère."
 adv_dip_event.200.d_develop_nation: "Conseillers, ingénieurs et argent discret pour [SCOPE.sCountry('spy_target_country').GetName] - une générosité, en un sens, mais une générosité qui rend des comptes. Quelqu'un doit la diriger."
 adv_dip_event.200.d_false_flag: "Des preuves à fabriquer, à placer, à faire découvrir au bon moment - toutes désignant [SCOPE.sCountry('spy_target_country').GetName]. Le faussaire de cette piste doit être au-dessus de tout soupçon."
 adv_dip_event.200.x: "Annulez tout."
