# # # # # DEVELOPMENT JOURNAL # # # # #
adv_dip_je_development: "Pierre après pierre"
adv_dip_je_development_reason: "Notre nation assiste [SCOPE.gsCountry('target').GetName] dans son développement. Nous lui fournissons les ressources nécessaires pour moderniser son industrie, son armée et sa société. Cela l'aidera à nous rattraper, mais resserrera aussi nos liens.\n\nNous devons toutefois veiller à ce que cette assistance n'en fasse pas une puissance rivale. Il nous faut conserver notre influence sur son développement et faire en sorte qu'elle reste dépendante de nous pour ses avancées technologiques."

adv_dip_je_share_technologies: "Partager les technologies"
adv_dip_je_share_technologies_desc: "Envoyez ingénieurs et plans pour accélérer le développement de la nation."

adv_dip_je_development_success: "Le programme de développement est un succès."

development_progress_bar: "Progrès du développement"
development_progress_bar_desc: "Progrès du développement"
DEVELOPMENT_PROGRESS_BAR_MONTHLY_PROGRESS_DESC: "Développement mensuel naturel"

adv_dip_je_encourage_settlers: "Encourager les colons"
adv_dip_je_encourage_settlers_desc: "Encourage les colons à s'installer en [SCOPE.gsCountry('target').GetName]. Cela l'aidera à développer son industrie et sa société, mais pourrait aussi créer des tensions avec la population locale."
adv_dip_je_garner_influence: "Gagner de l'influence"
adv_dip_je_garner_influence_desc: "Gagnez de l'influence en [SCOPE.gsCountry('target').GetName] pour assurer le succès de notre programme de développement. Cela nous aidera à conserver notre influence sur son développement et à faire en sorte qu'elle reste dépendante de nous pour ses avancées technologiques."

development_encourage_settlers_modifier: "Encouragement des colons"
development_garner_influence_modifier: "Gain d'influence"

# # # # # ASSASSINATION EVENTS # # # # #

assassination_costs_tt: "Coût courant de l'assassinat"
assassination_low_risk_loc: "Risque d'échec faible"
assassination_medium_risk_loc: "Risque d'échec modéré"
assassination_high_risk_loc: "Risque d'échec élevé"

# Trigger Event
adv_dip_assassination_event.100.t: "Plans de pacification"
adv_dip_assassination_event.100.d: "L'ordre a été donné. Notre service va monter un plan pour l'élimination d'un dirigeant étranger ; la première étape est de choisir qui l'exécutera."
adv_dip_assassination_event.100.f: "Les plans se mettent en place ; il nous faudra un meneur pour cette affaire, et une cible sur qui placer le contrat."
adv_dip_assassination_event.100.a: "Parfait."

# Leader Selection Event
adv_dip_assassination_event.101.t: "Choix du meneur"
adv_dip_assassination_event.101.d: "Il nous faut un meneur pour le complot d'assassinat à venir. Qui doit organiser l'entreprise ?"
adv_dip_assassination_event.101.f: "Nous devons choisir quelqu'un de fort et d'intelligent pour nous mener au succès."

# Target Selection Event
adv_dip_assassination_event.102.t: "Choix de la cible"
adv_dip_assassination_event.102.d: "Il nous faut une cible pour le complot à venir. Qui devons-nous viser ?"
adv_dip_assassination_event.102.f: "Quelle que soit l'option retenue, ce sera assurément un bon choix."
adv_dip_assassination_event.102.b: "Laissez tomber."

# Trigger Journal Event
adv_dip_assassination_event.103.t: "Tout se met en place"
adv_dip_assassination_event.103.d: "Tout est en place pour l'élimination de l'ennemi politique. L'envoi de l'assassin est organisé et les plans d'élimination de la cible sont arrêtés. L'opération est lancée."
adv_dip_assassination_event.103.f: "Espérons que tout se passe sans accroc ; l'affaire sera réglée en un rien de temps, j'en suis sûr."
adv_dip_assassination_event.103.a: "Bien."

# Flavour Events
adv_dip_assassination_event.110.t: "Des ennuis dans le métro ?"
adv_dip_assassination_event.110.d: "Notre assassin a malheureusement perdu la trace de la cible pendant quelques heures. Mais alors qu'il flânait dans la ville, il s'attabla pour manger un morceau chez un marchand de sandwichs — et découvrit la cible attablée à quelques tables de là. Après son départ, l'assassin trouva sur la table un billet contenant des renseignements sur la cible."
adv_dip_assassination_event.110.f: "L'assassin s'affala dans un coin de la boutique, chapeau rabattu sur les yeux. Un jambon-fromage à moitié mangé gisait, oublié, tandis qu'il observait sa proie trois tables plus loin. \n\n« De tous les marchands de sandwichs de toutes les villes du monde... » marmonna l'assassin, mémorisant soigneusement les compagnons et les manières de la cible. \n\nAu départ de celle-ci, une serviette pliée attira son œil. D'une écriture hâtive : horaires de rendez-vous, rotations des gardes, et un plan grossier de la résidence. L'assassin sourit. La fortune sourit aux patients — et aux affamés."
adv_dip_assassination_event.110.a: "J'adore un bon sandwich."
adv_dip_assassination_event.110.b: "Tout ça, c'est de la mortadelle."

adv_dip_assassination_event.111.t: "Un chat par jour éloigne la cible pour toujours"
adv_dip_assassination_event.111.d: "Notre assassin entra dans l'une des pièces : sur le balcon se trouvait le chat de la cible. En parlant au chat, l'assassin comprit qu'il lui livrait des renseignements exacts sur l'emploi du temps de son maître."
adv_dip_assassination_event.111.f: "« Curieuse créature », chuchota l'assassin, accroupi près de la balustrade du balcon. Le chat tigré de la cible l'observait avec une intelligence troublante, la queue balayant méthodiquement la pierre. \n\nChaque fois que l'assassin prononçait le nom de la cible, les oreilles du chat frémissaient selon un motif singulier. Après une heure de cette étrange communion, l'assassin en avait appris davantage sur les habitudes de la cible qu'une semaine de surveillance classique n'aurait pu en livrer. \n\nL'assassin gratta le chat derrière les oreilles, songeur. « Ou bien tu es le félin le plus remarquable qui soit, ou bien j'ai enfin perdu l'esprit. » Le chat se contenta de ronronner."
adv_dip_assassination_event.111.a: "Pas de témoins. Poussez le chat."
adv_dip_assassination_event.111.b: "Gardons nos ennemis tout près. Caressez-le de ma part."

adv_dip_assassination_event.112.t: "Les roses sont rouges, les chats aussi"
adv_dip_assassination_event.112.d: "Notre assassin était dans les jardins quand il trébucha sur un corps étendu au sol. À en juger par ce qu'il en reste, c'était un chat ; il semble... mort ? Peut-être est-il tombé du balcon au-dessus."
adv_dip_assassination_event.112.f: "L'assassin errait dans la brume matinale du jardin, humant le doux parfum des primevères. Un éclat cramoisi parmi les jacinthes attira son regard — les restes déchiquetés de ce qui semblait être le félin chéri de la cible. \n\n« Pauvre bête, remarqua le jardinier, surgi soudain avec son sécateur. C'est arrivé dans la nuit. Je l'ai trouvé tel que vous le voyez. » \n\nL'assassin leva les yeux vers le balcon qui surplombait la scène. « Une chute, selon vous ? » \n\nLe vieux jardinier haussa les épaules. « Troisième “accident” du genre ce mois-ci. Le maître les remplace — même robe, même nom. Comme si personne n'allait s'en apercevoir. » Il cracha par terre. « Si vous voulez mon avis, les chats ne sont pas les seules choses jetables dans cette maison. »"
adv_dip_assassination_event.112.a: "Nettoyez tout cela, c'est la moindre des choses."
adv_dip_assassination_event.112.b: "Je croyais que les chats retombaient toujours sur leurs pattes ?"

adv_dip_assassination_event.113.t: "La chambre des secrets"
adv_dip_assassination_event.113.d: "Notre assassin rôdait dans les appartements quand une femme de chambre le prit à part pour lui conter de sinistres histoires sur la cible. Elle nous fait une offre : elle nous livrera de précieux renseignements si nous garantissons sa sécurité."
adv_dip_assassination_event.113.f: "Les mains de la femme de chambre tremblaient sur son tablier. « Je sers cette maison depuis onze ans, chuchota-t-elle, les yeux fuyant vers le couloir. Ce que j'ai vu vous glacerait le sang. » \n\nL'assassin se pencha. « Si ce que vous dites est vrai— » \n\n« Si ? » Elle eut un rire cassant. « Je peux vous dire quand ils dorment, ce qu'ils mangent, qui visite leurs appartements la nuit. Je peux vous dire des choses à renverser des gouvernements. » Son expression se durcit. « Mais d'abord, il me faut des garanties. \n\nQuand tout sera fini, je veux un passage pour Ostende et assez d'argent pour disparaître. » \n\nL'assassin pesa la proposition, mettant en balance loyauté et opportunité."
adv_dip_assassination_event.113.a: "Acceptez ; il est important de savoir à quoi nous avons affaire."
adv_dip_assassination_event.113.b: "Refusez ; nous ne pouvons nous permettre ce risque."

adv_dip_assassination_event.114.t: "L'Empire contre-attaque"
adv_dip_assassination_event.114.d: "Une explosion secoue notre bâtiment gouvernemental et un assassin est pris dans le souffle. Interrogé par nos équipes, il révèle un complot visant à assassiner [SCOPE.sCharacter('adv_dip_leader').GetFullName]."
adv_dip_assassination_event.114.f: "Le verre crissait sous les bottes tandis que les secours tiraient des corps des décombres. L'aile est du bâtiment gouvernemental gisait en ruine, la fumée montant encore des pierres noircies. \n\nDans une salle sécurisée du sous-sol, l'assassin capturé s'affaissait sur sa chaise, ensanglanté mais provocant. « Vous croyez être les seuls à savoir jouer à ce jeu ? cracha-t-il. Mes employeurs vous adressent leurs salutations. » \n\nL'interrogateur posa des photographies devant le prisonnier — des clichés de surveillance du dirigeant de la nation. « Cela s'arrête maintenant, dit-il doucement. D'une manière ou d'une autre. » \n\nDehors, à la tombée du soir, des gardes supplémentaires prirent position autour de la résidence présidentielle. Le jeu venait de monter d'un cran."
adv_dip_assassination_event.114.a: "Arrêtez l'assassin et exigez des réponses."
adv_dip_assassination_event.114.b: "Étouffez l'affaire ; faites disparaître l'assassin."

adv_dip_assassination_event.115.t: "Coulent-elles ?"
adv_dip_assassination_event.115.d: "Alors qu'il écumait les tavernes du coin, l'assassin entendit parler d'une sorcière. Il rendit visite à la « sorcière » dans les bois : elle lui affirma que la cible était un démon déguisé et lui offrit, contre paiement, une soupe d'herbes à faire boire à notre cible ainsi que des renseignements très précis sur elle."
adv_dip_assassination_event.115.f: "Le vent hurlait à travers la masure délabrée de la sorcière tandis qu'elle remuait son chaudron de ses doigts noueux. L'assassin observait, sceptique, depuis le seuil. \n\n« Pas un démon au sens classique, marmonna la vieille en jetant des herbes séchées dans sa mixture. Mais contre nature tout de même. Il boit la jeunesse des servantes. Se baigne dans le lait et le sang. » \n\nElle tendit une fiole bouchée d'un liquide trouble. « Trois gouttes dans son vin. Pas davantage. Quand il se mettra à suer du sang, vous saurez que cela agit. » \n\nL'assassin hésita. La somme demandée était considérable, mais si la moitié seulement de ses renseignements se vérifiait... \n\n« D'où tenez-vous un tel savoir ? » demanda l'assassin. \n\nLe sourire de la sorcière découvrit des dents noircies. « J'ai servi son père. Et le père de son père. »"
adv_dip_assassination_event.115.a: "Peut-être devrions-nous croire en cette magie."
adv_dip_assassination_event.115.b: "Nous aurions plus de chance avec une boule magique."

adv_dip_assassination_event.116.t: "Une bien mauvaise fosse"
adv_dip_assassination_event.116.d: "L'assassin réglait ses comptes avec un poulet mal cuit de la veille quand il trouva des papiers dans les latrines. À en croire ces documents, la cible assistera demain à une réception à l'hôtel de ville."
adv_dip_assassination_event.116.f: "L'estomac de l'assassin se tordait violemment tandis qu'il se recroquevillait dans les latrines nauséabondes. Le poulet de la veille avait été une grave erreur. \n\nEn cherchant à tâtons des bouts de chiffon, ses doigts frôlèrent un papier glissé derrière une pierre descellée. C'était une note froissée — un emploi du temps, semblait-il, griffonné à la hâte. La cible assisterait à une réception municipale le lendemain soir. \n\nL'assassin empocha soigneusement le papier en grimaçant sous une nouvelle vague de nausée. Le renseignement peut venir des endroits les plus inattendus — et les moins dignes."
adv_dip_assassination_event.116.a: "Très intéressant."
adv_dip_assassination_event.116.b: "Nous ne pouvons nous fier à ces renseignements."

adv_dip_assassination_event.117.t: "Erfart"
adv_dip_assassination_event.117.d: "Alors que l'assassin prenait part à un banquet à l'hôtel de ville, une poutre porteuse céda et le plancher s'effondra. Notre assassin et de nombreux convives tombèrent dans la fosse d'aisances qui s'étendait sous le plancher ; malgré plusieurs tentatives de sauvetage, ils se noyèrent dans l'immondice. Par chance pour nous, la cible en faisait partie."
adv_dip_assassination_event.117.f: "Le grand banquet de l'hôtel de ville battait son plein quand les premiers craquements sinistres résonnèrent dans la salle. Les convives échangèrent des regards nerveux tandis que la poussière pleuvait des poutres antiques. \n\nL'assassin, assis à trois places de la cible, venait de se lever pour s'excuser quand le plancher céda dans un craquement de tonnerre. Des cris déchirèrent l'air tandis que nobles, domestiques et l'assassin lui-même plongeaient dans les ténèbres fétides. \n\nLes secours se poursuivirent toute la nuit, les lanternes éclairant l'horreur à mesure que les corps étaient tirés de la fosse. Parmi eux, ironie du sort, gisait la cible — le destin avait accompli ce que la planification minutieuse n'avait pu faire."
adv_dip_assassination_event.117.a: "Au moins, le problème est réglé."

adv_dip_assassination_event.118.t: "Le calice empoisonné"
adv_dip_assassination_event.118.d: "Un grand banquet se tient au bâtiment gouvernemental, avec des invités venus de tout le pays. Notre assassin s'y régalait de canapés au saumon et au caviar quand il vit une occasion d'empoisonner le verre de la cible."
adv_dip_assassination_event.118.f: "Le cuisinier fut payé deux fois : une fois par le palais, et une fois, bien mieux, par nous. La bouteille est décantée sur la desserte, et le dîner est à neuf heures."
adv_dip_assassination_event.118.a: "Tentez d'empoisonner son verre."
adv_dip_assassination_event.118.b: "Laissez cela pour l'instant ; mêlez-vous aux invités et agissez normalement. Recueillez des renseignements sur la cible."
adv_dip_assassination_event.118.c: "Empoisonnez sa nourriture et faites porter le blâme à [SCOPE.sCharacter('assassination_target_country_leader').GetFullName]"

adv_dip_assassination_event.119.t: "Le Fantôme de l'Opéra"
adv_dip_assassination_event.119.d: "[SCOPE.sCharacter('assassination_target').GetFullName] assiste à un opéra dans la capitale, en présence de dignitaires étrangers. L'occasion pourrait nous être favorable."
adv_dip_assassination_event.119.f: "Notre homme a une loge et un programme. Il n'a lu ni le livret ni les critiques ; son intérêt se borne à l'entracte, au corridor derrière les loges, et aux quatorze marches qui les séparent."
adv_dip_assassination_event.119.a: "Tirez pendant les applaudissements."
adv_dip_assassination_event.119.b: "Provoquez un incendie dans le bâtiment pour semer le chaos."
adv_dip_assassination_event.119.c: "Attendez un meilleur moment."


adv_dip_assassination_event.120.t: "Retour à l'expéditeur"
adv_dip_assassination_event.120.d: "Notre assassin travaillait pour la cible. Aujourd'hui, il s'est retourné et nous a posé un ultimatum : ou nous annonçons publiquement ce que nous faisons, ou nous le payons pour qu'il se taise et nous annulons la mission."
adv_dip_assassination_event.120.f: "Le message chiffré arriva par courrier de confiance, et son contenu glaçait. L'assassin — leur propre agent, choisi avec tant de soin — avait changé d'allégeance. \n\n« Votre fenêtre se referme, avertit le conseiller du ministre en posant l'ultimatum sur le bureau ciré. Il veut être payé pour se taire, sinon il rend tout public. » \n\nLe ministre contempla les jardins détrempés de pluie, calculant le dommage politique contre les fonds du Trésor contre sa réputation personnelle. \n\n« Combien ? » demanda-t-il enfin. \n\n« Plus que nous ne devrions payer, vint la sombre réponse. Mais peut-être moins que ce que vaut le silence. »"
adv_dip_assassination_event.120.a: "Nous le paierons."
adv_dip_assassination_event.120.b: "Je ne céderai pas un sou."

adv_dip_assassination_event.122.t: "L'Empire contre-attaque"
adv_dip_assassination_event.122.d: "Une explosion secoue notre bâtiment gouvernemental et les décombres écrasent plusieurs civils. L'essentiel du gouvernement est sain et sauf et les blessés sont soignés à l'heure qu'il est ; dans tout ce chaos, il apparaît que [SCOPE.sCharacter('adv_dip_leader').GetFullName] a été abattu."
adv_dip_assassination_event.122.f: "La fumée montait encore du quartier gouvernemental tandis que le ministre était informé dans le bunker d'urgence. Son visage devint cendreux à mesure que tombaient les bilans. \n\n« Dix-sept civils morts. Quarante-trois blessés. Et... » L'aide hésita, la voix brisée. « Notre dirigeant a été abattu pendant l'évacuation. Il n'a pas survécu. » \n\nDehors, les cloches des églises se mirent à sonner, la nouvelle se répandant comme une traînée de poudre dans la capitale. La riposte avait été prompte et brutale — œil pour œil. \n\nLe ministre ôta ses lunettes et se pinça l'arête du nez. « Et notre... opération ? Contre la cible étrangère ? » \n\n« Toujours en cours, monsieur. Dans l'attente de vos ordres. » \n\nLe poids de la décision pesait lourd dans l'air confiné du bunker."
adv_dip_assassination_event.122.a: "C'est inacceptable, mais nous devons poursuivre notre complot."
adv_dip_assassination_event.122.b: "Nous ne pouvons pas continuer ainsi."

adv_dip_assassination_event.123.t: "Contrôles et contrepoids"
adv_dip_assassination_event.123.d: "Lors d'un contrôle de routine de l'équipement de l'assassin, les gardes de la cible ont découvert une arme dissimulée. L'assassin a été placé en détention."
adv_dip_assassination_event.123.f: "La fausse identité de l'assassin avait tenu des semaines — jusqu'au contrôle de routine du bâtiment administratif. L'œil du garde s'était plissé sur un détail imperceptible ; s'ensuivirent une fouille plus poussée et la découverte d'une fine lame dissimulée dans une canne. \n\nÀ présent, l'assassin croupissait dans une cellule aveugle, le visage impassible, tandis que le rapport de l'arrestation traversait le bureau du ministre à des milliers de kilomètres de là. \n\n« Nous maintenons qu'il s'agit d'un vulgaire voleur, expliqua le secrétaire. Mais son silence ne durera pas éternellement. » \n\nLe ministre tapotait son stylo en cadence. « Quelles sont nos options d'exfiltration ? » \n\n« Limitées, monsieur. Très limitées. »"
adv_dip_assassination_event.123.a: "Faites-le évader. Faites tout ce qui est possible."
adv_dip_assassination_event.123.b: "Envoyez quelqu'un d'autre ; c'est une cause perdue."

adv_dip_assassination_event.124.t: "Un festin de champignons"
adv_dip_assassination_event.124.d: "L'assassin rôdait dans les jardins la nuit quand une petite faim le prit ; il trouva des champignons dans l'une des jardinières. N'y connaissant pas grand-chose, il en cueillit quelques-uns et les mangea quand même. Au matin, on retrouva l'assassin dans les latrines, empoisonné par les champignons."
adv_dip_assassination_event.124.f: "L'aube se levait sur le domaine quand les domestiques découvrirent l'assassin se tordant sur le sol des latrines. Non loin gisaient les preuves — des chapeaux d'amanite phalloïde, cueillis sans précaution dans le jardin expérimental du jardinier en chef. \n\n« Erreur de débutant, marmonna le médecin en lui faisant avaler du charbon de force. Manger des champignons inconnus dans le noir. Autant jouer à la roulette russe. » \n\nQuand la nouvelle atteignit la capitale, l'officier traitant arpentait son bureau avec anxiété. Des semaines de préparation, des milliers en pots-de-vin, le tout peut-être défait par un en-cas de minuit. Restait à trancher : abandonner la mission, ou parier sur la guérison."
adv_dip_assassination_event.124.a: "Accordez-lui quelques jours, puis qu'il reprenne la mission."
adv_dip_assassination_event.124.b: "Forcez-le à reprendre la mission immédiatement ; ce n'est tout simplement pas acceptable."

adv_dip_assassination_event.125.t: "Une lame dans l'ombre"
adv_dip_assassination_event.125.d: "Notre assassin filait la cible depuis des jours quand il remarqua une silhouette nouvelle suivant les mêmes habitudes. Après une observation attentive, il apparaît que nous ne sommes pas les seuls à en vouloir à la vie de [SCOPE.sCharacter('assassination_target').GetFullName]. Voilà une occasion - ou une complication."
adv_dip_assassination_event.125.f: "L'assassin se plaqua contre le mur de pierre humide, retenant son souffle, tandis qu'une autre ombre se détachait de l'obscurité de l'autre côté de la rue. Depuis trois nuits, cet inconnu apparaissait partout où allait la cible. \n\n« Un amateur », marmonna l'assassin en notant l'hésitation révélatrice de la silhouette à chaque coin de rue. Amateur ou non, sa présence compliquait considérablement les choses. \n\nUn second chasseur dans cette partie signifiait soit un allié précieux, soit un danger. Restait surtout la question la plus intrigante : qui d'autre voulait la mort de la cible — et ses intérêts s'accordaient-ils avec ceux des employeurs de l'assassin ?"
adv_dip_assassination_event.125.a: "Éliminez la concurrence. Nous ne pouvons risquer d'interférence."
adv_dip_assassination_event.125.b: "Continuez comme prévu, mais ouvrez l'œil."

adv_dip_assassination_event.126.t: "Le gambit du sosie"
adv_dip_assassination_event.126.d: "Notre assassin a découvert que [SCOPE.sCharacter('assassination_target').GetFullName] recourt fréquemment à un sosie pour ses apparitions publiques. Voilà qui explique plusieurs échecs de surveillance, mais pose aussi un nouveau défi : identifier la véritable cible."
adv_dip_assassination_event.126.f: "« La ressemblance est troublante, rapporta l'agent en faisant glisser deux photographies presque identiques sur la table. Même taille, même carrure. Jusqu'aux manières, parfaitement imitées. » \n\nLe maître-espion étudia les clichés avec une frustration croissante. Des semaines de préparation, et voilà cette complication. \n\n« À quelle fréquence a lieu la substitution ? » \n\n« Sans régularité. Parfois en pleine réception. Le premier cercle doit être au courant, mais personne d'autre. » \n\nLe maître-espion tapota ses dents d'un ongle jauni. « Alors il nous faut soit compromettre quelqu'un de ce cercle, soit trouver la seule chose qu'aucun sosie ne peut imiter parfaitement. » \n\n« C'est-à-dire ? » \n\n« L'habitude, mon cher. L'habitude profonde, enracinée. Chacun a ses manies — même ceux qui prétendent être un autre. »"
adv_dip_assassination_event.126.a: "Attachez-vous d'abord à identifier la véritable cible."
adv_dip_assassination_event.126.b: "Éliminez les deux. Nous ne pouvons nous permettre de manquer."

adv_dip_assassination_event.127.t: "Le dilemme de l'empoisonneur"
adv_dip_assassination_event.127.d: "Notre assassin a infiltré le personnel des cuisines et empoisonne lentement [SCOPE.sCharacter('assassination_target').GetFullName] avec une substance indétectable. Mais le médecin personnel de la cible commence à soupçonner quelque chose et a ordonné des changements dans son régime."
adv_dip_assassination_event.127.f: "La vapeur montait tandis que l'assassin remuait la marmite frémissante, le visage impassible malgré la nervosité qui lui courait dans les veines. Depuis des semaines, il ajoutait d'infimes traces d'arsenic aux plats favoris de la cible — pas assez pour un effet immédiat, mais suffisamment pour un déclin graduel et « naturel ». \n\nAujourd'hui pourtant, la routine avait été interrompue. Le médecin était arrivé sans prévenir, exigeant d'inspecter le garde-manger et ordonnant un menu entièrement nouveau. \n\n« L'estomac de Son Excellence est délicat, annonça le médecin en toisant le personnel avec suspicion. Désormais, il aura un goûteur personnel. » \n\nL'assassin s'inclina avec déférence, l'esprit en ébullition. Le fragile équilibre de patience et de poison venait d'être rompu. Il faudrait s'adapter."
adv_dip_assassination_event.127.a: "Passez à un poison plus rapide, advienne que pourra."
adv_dip_assassination_event.127.b: "Abandonnez cette approche et cherchez une autre faille."

adv_dip_assassination_event.128.t: "Le confessionnal"
adv_dip_assassination_event.128.d: "Notre assassin a appris que [SCOPE.sCharacter('assassination_target').GetFullName] est profondément pieux et se rend chaque semaine dans la même église pour se confesser. Cette habitude prévisible offre une occasion d'embuscade — mais pour beaucoup, une église est un lieu sacré."
adv_dip_assassination_event.128.f: "Le secrétaire de l'archevêque tient le registre des audiences, et le registre des audiences tient désormais notre calendrier. Une audience privée, une chapelle silencieuse, et aucun garde passé la porte."
adv_dip_assassination_event.128.a: "Frappez pendant la confession. L'intimité est parfaite."
adv_dip_assassination_event.128.b: "C'est un sacrilège. Trouvez une autre occasion."

adv_dip_assassination_event.129.t: "Le stratagème de la séduction"
adv_dip_assassination_event.129.d: "Notre assassin a noué une liaison avec un membre de la domesticité proche de [SCOPE.sCharacter('assassination_target').GetFullName]. La relation a progressé au point que notre agent dispose d'un large accès aux appartements privés de la cible — mais des complications sentimentales sont apparues."
adv_dip_assassination_event.129.f: "Le rapport était en retard parce que notre agent l'a écrit quatre fois. La version finale omet un nom qui figurait dans les trois brouillons, et cette omission est en soi la nouvelle."
adv_dip_assassination_event.129.a: "Rappelez l'assassin. Le sentiment l'a compromis."
adv_dip_assassination_event.129.b: "Exigez qu'il achève la mission immédiatement."


adv_dip_assassination_event.134.t: "Le réveil du plus apte"
adv_dip_assassination_event.134.d: "L'assassin s'est pleinement remis de l'empoisonnement et est prêt à poursuivre la mission."
adv_dip_assassination_event.134.f: "« Constitution remarquable, observa le médecin en prenant le pouls de l'assassin. La plupart seraient morts, ou définitivement diminués, après avoir ingéré ces champignons-là. » \n\nL'assassin se redressa avec précaution, encore pâle mais l'œil clair. « Quand puis-je reprendre mes fonctions ? » \n\nAu quartier général, la nouvelle de la guérison fut accueillie avec un soulagement palpable. Le calendrier de l'opération pourrait être tenu, moyennant de nouveaux protocoles sévères sur la cueillette non autorisée. \n\n« Dites-lui de s'en tenir aux aliments que nous avons contrôlés, ordonna l'officier traitant au messager. Et emportez peut-être quelques antidotes de plus. »"
adv_dip_assassination_event.134.a: "Excellente nouvelle. Dites-lui de ne plus jamais rien manger."

adv_dip_assassination_event.135.t: "Faire taire l'ombre"
adv_dip_assassination_event.135.d: "Notre assassin a éliminé le rival inconnu qui filait notre cible. En fouillant le corps, il a découvert des documents préoccupants reliant l'assassin mort à [SCOPE.sCharacter('assassination_rival_country_leader').GetFullName]."
adv_dip_assassination_event.135.f: "Le sang s'étalait sous le corps de l'inconnu dans la ruelle étroite, noir au clair de lune. Notre assassin fouilla méthodiquement le cadavre : un stylet d'une facture inhabituelle, et un étui de cuir imperméable cousu dans la doublure du manteau. \n\nÀ l'intérieur : des ordres rédigés en chiffre, un sceau de cire diplomatique brisé à la hâte sur le bord, et un plan détaillé de la résidence de la cible marquant des accès que notre propre renseignement avait manqués. \n\nL'assassin apprit les documents par cœur avant de craquer une allumette. Tandis que les papiers se recroquevillaient en cendres, son esprit courait d'implication en implication. Ce rival était bien financé, bien renseigné — et ses maîtres attendraient désormais des rapports qui ne viendraient jamais. \n\nLa partie comptait de nouveaux joueurs. Et en retirant une pièce de l'échiquier, notre assassin venait peut-être d'annoncer notre propre présence."
adv_dip_assassination_event.135.a: "Accélérez le calendrier. Nous devons frapper avant qu'on ne remarque son absence."

# Successful Final Event
adv_dip_assassination_event.198.t: "Et un de plus qui mord la poussière"
adv_dip_assassination_event.198.d: "Notre opération à l'étranger s'est achevée avec succès, et les rapports signalent la disparition de [SCOPE.sCharacter('assassination_target').GetFullName]. Quelle fâcheuse circonstance."
adv_dip_assassination_event.198.f: "Le ministre des Affaires étrangères ajusta sa cravate dans le miroir, le visage soigneusement composé en une expression de gravité de circonstance. \n\n« Tragique affaire, remarqua-t-il à son aide tandis qu'ils se préparaient pour la conférence de presse. Dire qu'une personne d'une telle envergure a pu simplement... disparaître. » \n\nDerrière les portes closes, un télégramme scellé reposait sur son bureau, au contenu bref : « L'affaire est réglée. Paiement à livrer comme convenu. » \n\nLe ministre s'autorisa un petit sourire satisfait avant de recomposer son masque d'inquiétude. La scène du monde comptait un acteur de moins ce soir."
adv_dip_assassination_event.198.a: "Merveilleux"

# Failed Final Event
adv_dip_assassination_event.199.t: "Mourir peut attendre"
adv_dip_assassination_event.199.d: "Nos agents à l'étranger ont été déjoués et [SCOPE.sCharacter('assassination_target').GetFullName] s'est échappé. Il y eut des tentatives, mais hélas aucune ne réussit. Nous ne pouvons risquer un nouvel essai."
adv_dip_assassination_event.199.f: "La pluie fouettait les fenêtres du ministère des Affaires étrangères tandis qu'on déchiffrait le message codé. Le visage du ministre s'assombrissait à chaque ligne. \n\n« Compromis, dit-il enfin en faisant glisser le papier vers son adjoint. La cible a été prévenue. Nos agents se sont dispersés. » \n\nDes années de préparation, des millions engloutis, d'innombrables risques pris — tout cela pour rien. La cible serait désormais doublement gardée, la fenêtre d'opportunité claquée. \n\n« Vos ordres, monsieur ? » \n\nLe ministre soupira, paraissant soudain bien plus vieux que son âge. « Rappelez tout le monde. Détruisez les preuves. Cette opération n'a jamais existé. » Son regard se perdit dans le vague. « Il y aura d'autres occasions. Il y en a toujours. »"
adv_dip_assassination_event.199.a: "Ce n'est pas suffisant."

