 law_directorate_of_state_security: "Direction de la sûreté de l'État"
 law_directorate_of_state_security_desc: "Un appareil de sécurité tourné d'abord vers l'intérieur : des informateurs dans chaque quartier, des agents étrangers traqués avec méthode, et la dissidence consignée bien avant de devenir révolte."
 law_deniable_assets: "Actifs niables"
