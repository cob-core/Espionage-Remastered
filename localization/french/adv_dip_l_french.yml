# # # # # DIPLOMATIC ACTION EVENTS # # # # #


adv_dip_event.21.t: "Soutenir les nationalistes"
adv_dip_event.21.d: "Les opérations d'espionnage du fier service secret de [ROOT.GetCountry.GetName] contre [SCOPE.sCountry('spy_target_country').GetName] viennent de franchir une étape majeure. Ses officiers sont convaincus qu'avec un peu de soutien, ils peuvent mener l'opération à un succès complet."
adv_dip_event.21.f: "L'officier de renseignement ajusta ses lunettes et déploya une carte détaillée sur le bureau du ministre. Des épingles rouges marquaient les foyers de soulèvement potentiels à travers le territoire de [SCOPE.sCountry('spy_target_country').GetName]. \n\n« Nos agents ont cultivé des relations avec plusieurs mouvements nationalistes, expliqua-t-il à voix basse malgré la porte close. Le service secret de [ROOT.GetCountry.GetName] estime qu'avec un soutien financier modeste et quelques livraisons d'armes bien placées, nous pourrions transformer un ressentiment latent en rébellion ouverte. » \n\nLe ministre suivit du doigt les frontières provinciales où des cultures opprimées s'usaient contre leurs maîtres. « Et naturellement, ces nations nouvellement indépendantes se souviendraient de qui a soutenu leur cause ? » \n\nLe mince sourire de l'officier fournit toute la confirmation nécessaire. « Elles s'en souviendraient, monsieur. Elles s'en souviendraient. »"
adv_dip_event.21.b: "Laissez tomber."

adv_dip_event.22.t: "Soulèvement des nationalistes"
adv_dip_event.22.d: "Des nationalistes partisans de l'indépendance du peuple [SCOPE.sCulture('discriminated_culture').GetName] se sont brusquement soulevés. Le renseignement de [ROOT.GetCountry.GetName] estime que ce soulèvement n'a rien de naturel et que l'ennemi en tire les ficelles."
adv_dip_event.22.f: "Le thé matinal du gouverneur fut interrompu par des coups pressants. Un aide de camp fit irruption, un télégramme à la main. \n\n« Des agitateurs nationalistes, monsieur — des séparatistes [SCOPE.sCulture('discriminated_culture').GetName] — se sont emparés des bâtiments municipaux dans trois villes. Ils hissent leur propre drapeau et distribuent des pamphlets exigeant l'indépendance. » \n\nLe gouverneur reposa sa tasse avec un calme forcé. « Et leur armement ? » \n\n« Des fusils modernes, monsieur. De fabrication étrangère. » \n\n« Je vois. » La pièce n'était plus troublée que par le tic-tac de l'horloge. « Ceci n'est pas un soulèvement spontané. Cela porte la marque d'une ingérence de [ROOT.GetCountry.GetName]. » Il soupira et saisit plume et papier. « Alertez la garnison. Je dois informer la capitale. »"
adv_dip_event.22.a: "Les autorités sauront s'en charger, j'en suis sûr."
adv_dip_event.22.b: "Matez-les."

adv_dip_event.31.t: "Soutien à la liberté"
adv_dip_event.31.d: "Les opérations d'espionnage du fier service secret de [ROOT.GetCountry.GetName] contre [SCOPE.sCountry('spy_target_country').GetName] viennent de franchir une étape majeure. Ses officiers sont convaincus qu'avec un peu de soutien, ils peuvent mener l'opération à un succès complet."
adv_dip_event.31.f: "Des cartes de [SCOPE.sCountry('spy_target_country').GetName] couvraient les murs de la salle de situation, constellées d'annotations marquant bâtiments officiels, installations militaires et nœuds de transport. \n\n« Leur mécontentement envers la tutelle de [SCOPE.sCountry('spy_target_country_overlord').GetName] croît chaque jour, expliqua le directeur du renseignement. Nous avons identifié des sympathisants clefs dans leur administration et leur armée. Avec des fonds et des encouragements appropriés, nous pourrions transformer ce mécontentement en véritable mouvement d'indépendance. » \n\nLe ministre des Affaires étrangères tambourina des doigts, songeur. « Et une fois indépendants, ils chercheraient naturellement de nouvelles alliances... » \n\n« Précisément, monsieur. Une nation nouvelle, reconnaissante envers [ROOT.GetCountry.GetName], placée directement à la frontière de [SCOPE.sCountry('spy_target_country_overlord').GetName]. » \n\nLes implications restèrent suspendues en silence dans l'air entre eux."
adv_dip_event.31.a: "Nous devrions y consacrer davantage de fonds."
adv_dip_event.31.b: "Laissez tomber."

adv_dip_event.32.t: "Un investisseur anonyme"
adv_dip_event.32.d: "Ces derniers temps, certains citoyens de [ROOT.GetCountry.GetName] élèvent la voix contre [SCOPE.sCountry('spy_target_country_overlord').GetName]. Ils continuent d'investir dans diverses industries d'armement tout en exigeant leur indépendance de [SCOPE.sCountry('spy_target_country_overlord').GetName]."
adv_dip_event.32.f: "Le rapport du commissaire de police était ouvert sur le bureau du ministre de l'Intérieur, et son contenu était préoccupant. \n\n« Ces fabricants d'armes déclarent des investissements substantiels de sources anonymes, expliqua le commissaire. Comme par hasard, le sentiment hostile à [SCOPE.sCountry('spy_target_country_overlord').GetName] a quadruplé dans les régions concernées, avec des manifestations de plus en plus organisées exigeant l'indépendance. » \n\nLe ministre contempla la capitale paisible de [ROOT.GetCountry.GetName]. « Vous soupçonnez une implication étrangère ? » \n\n« Le moment est suspect, monsieur. Ces prétendus groupes de citoyens ont surgi du jour au lendemain avec une organisation et des fonds surprenants. Leur rhétorique reprend presque mot pour mot les récentes déclarations diplomatiques de nos rivaux. » \n\n« Comme c'est commode, murmura le ministre. Comme c'est infiniment commode. »"
adv_dip_event.32.a: "Était-ce bien nécessaire ?"
adv_dip_event.32.b: "Décidément suspect."

adv_dip_event.33.t: "Une rumeur inquiétante"
adv_dip_event.33.d: "Ces derniers temps, certains citoyens de [SCOPE.sCountry('spy_target_country').GetName] élèvent la voix contre [ROOT.GetCountry.GetName]. Ils continuent d'investir dans diverses industries d'armement tout en exigeant leur indépendance de [ROOT.GetCountry.GetName]."
adv_dip_event.33.f: "Le point matinal du ministre de la Sûreté avait pris un tour inconfortable. \n\n« Les rapports de plusieurs provinces signalent des troubles coordonnés, expliqua l'officier de renseignement. Des pamphlets exigeant l'indépendance circulent dans les usines et les universités. Plus préoccupant encore, monsieur : des preuves d'investissements étrangers substantiels dans la production d'armes nationale. » \n\n« Les sujets de [ROOT.GetCountry.GetName] ne se réveillent pas un beau matin en décidant collectivement de s'armer, répliqua sèchement le ministre. Quelles puissances étrangères sont impliquées ? » \n\nL'officier hésita. « Nous avons des raisons de soupçonner les services de renseignement de [SCOPE.sCountry('spy_target_country').GetName], monsieur. La rhétorique, le moment choisi, les méthodes — tout porte leur marque. » \n\nUn lourd silence emplit la salle tandis que les implications retombaient comme de la poussière."
adv_dip_event.33.a: "Était-ce bien nécessaire ?"
adv_dip_event.33.b: "Décidément suspect."




adv_dip_event.11.t: "Semer les graines du mécontentement"
adv_dip_event.11.d: "Les opérations d'espionnage du fier service secret de [ROOT.GetCountry.GetName] contre [SCOPE.sCountry('spy_target_country').GetName] viennent de franchir une étape majeure. Ses officiers sont convaincus qu'avec un peu de soutien, ils peuvent mener l'opération à un succès complet."
adv_dip_event.11.f: "Le ministre lut les rapports de province dans l'ordre : une grève dans les villes minières, un grenier incendié, trois pamphlets en trois dialectes disant la même chose. Chacun, pris seul, pouvait n'être qu'un malheur. Il reposa le dossier et demanda à qui le crime profitait."
adv_dip_event.11.a: "Exécutez l'ordre."
adv_dip_event.11.b: "Laissez tomber."

adv_dip_event.12.t: "Le mécontentement gronde"
adv_dip_event.12.d: "Ces derniers temps, certains citoyens élèvent la voix contre [ROOT.GetCountry.GetName]. Des gens achètent des armes et semblent descendre dans la rue en nombre préoccupant."
adv_dip_event.12.f: "Le rapport du préfet de police s'abattit sur la table du Conseil avec un bruit sourd. \n\n« Des manifestations coordonnées ont éclaté dans sept villes simultanément, expliqua-t-il, les cernes sous ses yeux trahissant des nuits blanches. Le plus troublant n'est pas leur synchronisation, mais leur armement — des fusils neufs apparus du jour au lendemain entre des mains civiles. » \n\nLe ministre de l'Intérieur fronça les sourcils. « Les manifestations spontanées n'arrivent pas avec des armes assorties. » \n\n« Non, monsieur. Nous avons intercepté des communications suggérant une implication étrangère — plus précisément des agents fournissant à la fois des fonds et des armes de qualité militaire. » \n\nAutour de la table, les ministres échangèrent des regards inquiets. Ce qui avait commencé comme des doléances éparses s'était mué, à une vitesse troublante, en mouvement organisé — et soutenu de l'extérieur."
adv_dip_event.12.a: "Voilà qui n'est pas idéal."
adv_dip_event.12.b: "Nous devons investir pour écraser la dissidence."


adv_dip_event.81.t: "Poches dorées"
adv_dip_event.81.d: "Un jeu d'intrigue et d'espionnage nous a ouvert des portes importantes. Nous avons désormais infiltré [SCOPE.sCountry('spy_target_country').GetName] et pourrions gagner certains membres de partis à notre influence."
adv_dip_event.81.f: "L'attaché diplomatique referma le coffre de l'ambassade avec un déclic satisfait. À l'intérieur reposaient des profils détaillés de politiciens influents de [SCOPE.sCountry('spy_target_country').GetName] — dettes, vices, ambitions et faiblesses méticuleusement catalogués. \n\n« Nous avons identifié trois cibles principales, expliqua-t-il à son supérieur. Un ministre criblé de dettes de jeu, un secrétaire de parti aux goûts dispendieux, et une étoile montante dont les ambitions politiques excèdent les moyens. » \n\n« Et leur prix ? » \n\n« Variable, mais raisonnable. Une aide financière, des promesses de soutien futur, une place pour leurs enfants dans nos universités. » Il eut un mince sourire. « Tout le monde a un prix — nous avons simplement mis de la méthode à découvrir ce que chacun estime le plus. » \n\n« Excellent. Commencez par l'étoile montante — la jeunesse est toujours plus malléable que l'expérience. »"
adv_dip_event.81.b: "Pas pour le moment."

adv_dip_event.82.t: "Un basculement de la scène politique"
adv_dip_event.82.d: "Certains personnages du gouvernement semblent recevoir un soutien extérieur démesuré et paraissent gagner une formidable dynamique."
adv_dip_event.82.f: "Le dépouillement fut achevé en milieu de matinée. L'après-midi, les hommes que notre argent avait fait élire prêtaient serment, et le soir, la première des nominations promises était discrètement confirmée. Personne dans l'hémicycle ne prononça notre nom. Personne n'en avait besoin."
adv_dip_event.82.a: "Ce n'est rien, j'en suis sûr."
adv_dip_event.82.b: "Suspendez le gouvernement. Chassez-les tous, sur-le-champ."

adv_dip_event.91.t: "Espionnage scientifique"
adv_dip_event.91.d: "Nos agents ont identifié plusieurs occasions d'acquérir des secrets technologiques de [SCOPE.sCountry('spy_target_country').GetName]. Nous devons décider sur quel domaine de recherche concentrer nos efforts d'espionnage."
adv_dip_event.91.f: "Le directeur du renseignement étala trois dossiers sur le bureau, chacun détaillant une cible technologique différente en [SCOPE.sCountry('spy_target_country').GetName]. \n\n« D'abord, leurs innovations industrielles — de nouveaux procédés de fabrication qui pourraient révolutionner nos méthodes de production. Ensuite, leurs avancées militaires — en particulier dans l'artillerie et l'architecture navale. Enfin, leurs institutions sociales — des systèmes d'éducation et un génie civil aux résultats remarquables. » \n\nIl tapota chaque chemise tour à tour. « Nous avons les ressources pour explorer une seule voie à fond. La question est : quels secrets serviraient le mieux les intérêts de la nation ? »"
adv_dip_event.91.a: "Leurs méthodes industrielles pourraient transformer notre économie."
adv_dip_event.91.b: "La technologie militaire est vitale pour notre sécurité."
adv_dip_event.91.c: "Leurs avancées sociales pourraient moderniser notre nation."
adv_dip_event.91.g: "Laissons cela pour l'instant."

adv_dip_event.92.t: "Vol de technologie découvert"
adv_dip_event.92.d: "Nos services de sécurité ont mis au jour des preuves du vol de nos secrets technologiques."
adv_dip_event.92.f: "Le rapport du chef de la Sûreté était d'une lecture sinistre. Des agents étrangers avaient profondément infiltré nos institutions de recherche et fait main basse sur de précieuses données technologiques. \n\nDes plans avaient été copiés, des journaux de recherche photographiés et, dans certains cas, du personnel clef soudoyé pour livrer des informations sensibles. La brèche paraissait systématique et bien organisée, portant toutes les marques d'un espionnage d'État. \n\nLe plus préoccupant était le caractère ciblé du vol — les espions savaient exactement ce qu'ils cherchaient, ce qui suggère une grave fuite au plus haut niveau."
adv_dip_event.92.a: "Renforcez la sécurité immédiatement !"
adv_dip_event.92.b: "Ce n'est rien, j'en suis sûr."




adv_dip_event.110.t: "Un programme commence"
adv_dip_event.110.d: "Nos conseillers et nos fonds sont arrivés dans la nation ciblée. Le programme de développement prendra des années, et ses progrès dépendront de ce que nous serons prêts à dépenser."
adv_dip_event.110.f: "L'amphithéâtre bourdonnait d'enthousiasme tandis que les intellectuels locaux absorbaient avidement les derniers principes scientifiques. Nos conseillers avaient passé des mois à introduire avec soin les méthodes modernes, et les résultats devenaient manifestes.\n\n« Leur maîtrise des concepts industriels est remarquable, rapporta le conseiller principal. Ce qui aurait demandé des décennies de développement isolé, ils l'ont assimilé en quelques mois. Plusieurs étudiants prometteurs ont déjà proposé des améliorations à nos propres plans. »\n\nSous couvert de modernisation, ce transfert de savoir servait nos intérêts stratégiques plus larges. Un [SCOPE.sCountry('development_target').GetName] développé serait un partenaire commercial plus précieux - et un allié plus sûr."
adv_dip_event.110.a: "Le savoir élève toutes les nations."

adv_dip_event.111.t: "Les fruits du progrès"
adv_dip_event.111.d: "Notre programme de développement en [SCOPE.sCountry('development_target').GetName] a connu un succès remarquable. Par des conseils avisés et un investissement soutenu, nous avons aidé à transformer leurs structures décentralisées en un appareil d'État plus cohérent."
adv_dip_event.111.f: "Le ministre des Affaires étrangères parcourut les derniers rapports d'avancement avec une immense satisfaction. Ce qui n'avait été qu'un assemblage lâche de conseils tribaux et d'autorités régionales s'était mué en gouvernement central opérant.\n\n« Le réseau ferroviaire relie désormais leurs principaux centres de population, rapporta son aide. Leur fonction publique a adopté les méthodes administratives modernes, et leur armée obéit à un commandement unifié. »\n\nSur le mur, une carte fraîchement imprimée montrait des frontières nettes et définies là où il n'y avait eu que des territoires disputés. En moins d'une génération, une nation moderne avait émergé de la décentralisation.\n\n« Et naturellement, ajouta le ministre avec un sourire satisfait, ils se souviennent de qui les a aidés à accomplir cette transformation. »"
adv_dip_event.111.a: "Un triomphe du développement."

adv_dip_event.112.t: "Le progrès déraille"
adv_dip_event.112.d: "Nos tentatives de faire de [SCOPE.sCountry('development_target').GetName] une nation centralisée se sont soldées par un échec. Les structures de pouvoir locales se sont révélées trop enracinées, et nos efforts pour moderniser leur société se sont heurtés à une résistance farouche."
adv_dip_event.112.f: "Le bureau du ministre du Développement était jonché de plans abandonnés et de projets d'infrastructure inachevés. Des années d'investissement et d'expertise s'étaient brisées sur les récifs de l'autorité traditionnelle.\n\n« Les chefs régionaux ont rejeté nos réformes administratives en bloc, rapporta sombrement le coordinateur du projet. Ils voient la centralisation comme une menace pour leurs pouvoirs ancestraux. Les voies ferrées que nous avons construites sont sabotées, et nos conseillers sont chassés des campagnes. »\n\nSous la fenêtre, des caisses de matériel moderne étaient emballées pour le voyage du retour - monuments d'une ambition défaite par la réalité.\n\n« Peut-être, soupira le ministre, certaines nations ne sont-elles pas prêtes pour les changements que nous envisageons. »"
adv_dip_event.112.a: "Tant d'efforts, gâchés."

adv_dip_event.120.t: "Le chemin de fer clandestin"
adv_dip_event.120.d: "Notre réseau d'abolitionnistes a aidé un groupe de personnes réduites en esclavage à s'échapper de [SCOPE.sCountry('spy_target_country').GetName]. Elles ont trouvé refuge sur notre territoire, apportant avec elles des récits éprouvants et la détermination de bâtir une vie nouvelle en liberté."
adv_dip_event.120.f: "La maison sûre était silencieuse, hormis des sanglots étouffés de soulagement. Une douzaine d'âmes fraîchement libérées se serraient autour d'un âtre chaleureux, leur périple éprouvant enfin achevé. Leur évasion avait été méticuleusement préparée - passeurs bienveillants, compartiments dissimulés dans les chariots, faux papiers préparés par nos agents.\n\n« Ils vont nous chercher », murmura une femme en serrant son nourrisson contre elle.\n\n« Qu'ils cherchent, répondit fermement le chef de station. Vous êtes en [ROOT.GetCountry.GetName] désormais. Ici, vous êtes des gens libres. »\n\nQuand la nouvelle atteignit la capitale, les fonctionnaires entamèrent le délicat travail d'installer les réfugiés tout en préservant un déni plausible quant à l'implication du réseau."
adv_dip_event.120.a: "Accueillez-les dans la liberté."


