 adv_dip_event.131.t: "Un commandant vacille"
 adv_dip_event.131.d: "Après des mois de patiente approche, nos agents rapportent que [SCOPE.sCharacter('steal_commander_target').GetFullName], commandant au service de [SCOPE.sCountry('spy_target_country').GetName], pourrait être persuadé de changer d'allégeance — moyennant les bonnes garanties, et le bon prix."
 adv_dip_event.131.f: "La rencontre eut lieu dans une loge privée de l'opéra, où la conversation pouvait se noyer sous l'orchestre. \n\n« Le commandant est... réceptif, rapporta notre agent. Écarté d'une promotion, humilié par l'état-major, et marié à une épouse aux goûts dispendieux. Chaque grief est une porte, et celle-ci est entrouverte. » \n\nRestait la question de l'usage d'un tel atout. Le faire passer la frontière pour prendre une commission sous notre drapeau ? Le laisser en place, à nous livrer la doctrine et les dispositions de ses maîtres ? Ou refermer le dossier et admettre que le risque excède le gain ?"
 adv_dip_event.131.a: "Faites passer [SCOPE.sCharacter('steal_commander_target').GetFullName] dans notre camp."
 adv_dip_event.131.b: "Plus utile là où il est."
 adv_dip_event.131.c: "Refermez le dossier."
 adv_dip_event.132.t: "Défection !"
 adv_dip_event.132.d: "Un de nos commandants a fait défection vers [SCOPE.sCountry('defection_beneficiary').GetName]. Le corps des officiers est en émoi, et l'on demande qui a permis à des agents étrangers un accès aussi intime à notre armée."
 adv_dip_event.132.f: "Les quartiers du commandant furent trouvés en ordre parfait — uniformes repassés, sabre au mur, et une unique lettre de démission posée sous un encrier vide. \n\nLe temps que l'alerte soit donnée, le transfuge avait déjà passé la frontière, accueilli — selon nos attachés furieux — par une commission officielle et un domaine confortable. \n\nLe préjudice ne se limite pas à un commandement vacant. Chaque officier ayant servi aux côtés du traître est désormais suspect, chaque plan de guerre qu'il a touché, compromis. L'état-major exige des réponses que nous n'avons pas."
 adv_dip_event.132.a: "Trahison !"
