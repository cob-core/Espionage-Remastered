 adv_dip_event.155.t: "La traversée, souscrite"
 adv_dip_event.155.d: "Nos paiements aux trafiquants qui approvisionnent [SCOPE.sCountry('spy_target_country').GetName] arrivent à échéance. Le commerce profite à tous sauf à la cargaison, et devient de plus en plus dangereux pour ses financiers."
 adv_dip_event.155.f: "Les comptes sont tenus dans un bureau maritime qui traite officiellement de l'huile de palme. Coques rapides, pavillons de complaisance, capitaines payés en or et en silence.\n\nLes escadres de répression s'enhardissent chaque saison. Chaque navire arraisonné est un registre qu'elles pourraient lire, et certains de ces registres mènent ici."
 adv_dip_event.155.a: "Le commerce doit continuer."
 adv_dip_event.155.b: "C'est devenu trop dangereux. Cessez tout."
 adv_dip_event.156.t: "Le financier démasqué"
 adv_dip_event.156.d: "Des papiers saisis sur un navire négrier capturé prouvent que [SCOPE.sCountry('spymaster_slaver').GetName] finance la traite clandestine. Le monde civilisé en prend note."
 adv_dip_event.156.f: "L'équipe d'arraisonnement trouva l'horreur habituelle dans l'entrepont, et quelque chose de plus rare dans la cabine du capitaine : des lettres de change, des polices d'assurance et des lettres de crédit, toutes traçables.\n\nLe tribunal des prises publia chaque nom. Les éditoriaux suivirent dans une douzaine de capitales, et des ministres qui avaient serré la main du financier nient aujourd'hui l'avoir rencontré."
 adv_dip_event.156.a: "Monstrueux."
 black_market_quiet_tt: "Les navires débarquent leur cargaison sans encombre."
 black_market_intercepted_tt: "#N Une escadre de répression a saisi un de nos navires. Les preuves s'accumulent.#!"
 black_market_backlash_tt: "#v La traite clandestine qui approvisionne ce pays rend notre travail de libération plus facile à répandre.#!"
 character_role_operative: "Agent"
 adv_dip_debrief_operative: "Débriefer l'agent"
 adv_dip_event.190.t: "Recrutement (test)"
 adv_dip_event.190.d: "Un agent d'essai se présente au rapport."
 adv_dip_event.190.a: "Bienvenue."
 adv_dip_event.190.t: "Une nouvelle recrue"
 adv_dip_event.190.d: "Notre service de renseignement a achevé le contrôle d'un nouvel agent. Il est prêt à être affecté à l'étranger."
 adv_dip_event.190.f: "Le dossier arriva sur le bureau du directeur avec trois photographies et une synthèse qui taisait plus qu'elle n'énonçait. Des langues, un don pour le calcul, aucune famille à mentionner, et un tempérament que les évaluateurs qualifiaient d'« utilement quelconque ».\n\nLe directeur signa l'autorisation sans rencontrer la recrue. Dans ce métier, il vaut mieux être incapable de décrire ses propres gens."
 adv_dip_event.190.a: "Mettez-le au travail."
