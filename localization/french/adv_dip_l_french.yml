 adv_dip_event.41.t: "Des grains de sable dans la machine de guerre"
 adv_dip_event.41.d: "Nos agents infiltrés en [SCOPE.sCountry('spy_target_country').GetName] rapportent que leur appareil de recrutement est vulnérable. Des registres falsifiés, des réquisitions détournées et quelques pots-de-vin bien placés pourraient gravement entraver leur capacité à lever des troupes."
 adv_dip_event.41.f: "Le rapport est arrivé par valise diplomatique, dissimulé dans la paperasse banale d'une délégation commerciale. \n\n« Leur bureau de conscription fonctionne par habitude et par paperasserie, écrivait notre chef de station. Un registre égaré ici, une exemption falsifiée là, et des districts entiers manqueront simplement à l'appel. Leurs sergents instructeurs entraîneront des fantômes. » \n\nLe ministre de la Guerre pesa la proposition. Une telle opération ne serait pas bon marché — il faudrait acheter des commis, distraire des inspecteurs et effacer toute trace. Mais un ennemi incapable de remplir ses régiments est un ennemi à moitié vaincu avant le premier coup de feu."
 adv_dip_event.41.a: "Financez l'opération."
 adv_dip_event.41.b: "Pas à ce prix."
 adv_dip_event.42.t: "Des registres vides"
 adv_dip_event.42.d: "Quelque chose ne va pas du tout dans notre recrutement militaire. Les registres énumèrent des hommes qui n'existent pas, des réquisitions se volatilisent et les terrains d'entraînement restent à moitié vides. Ce n'est pas un accident — des agents étrangers sont à l'œuvre."
 adv_dip_event.42.f: "L'audit de l'inspecteur général était d'une lecture sinistre. \n\n« Trois districts ont déclaré des effectifs complets — pourtant les casernes sont vides. Les ordres de réquisition d'un bataillon d'instruction entier ont été détournés vers un entrepôt incendié il y a des années. Nos instructeurs signalent des recrues qui n'arrivent jamais. » \n\nLe schéma était trop cohérent pour relever de l'incompétence. Quelque part dans les rouages du recrutement, des mains étrangères tiraient les ficelles, et chaque jour de retard laissait un régiment de plus en sous-effectif."
 adv_dip_event.42.a: "Il nous faudra endurer."
 adv_dip_event.42.b: "Financez des opérations de contre-espionnage."
