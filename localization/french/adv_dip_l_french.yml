 adv_dip_debrief_tt: "Un compte rendu complet de ce que notre agent a vu à l'étranger affine la vision du service sur la guerre de l'ombre."
 operative_repatriation: "Rapatriement d'agents"
 operative_repatriation_desc: "Le signataire rend tous les agents capturés qu'il détient appartenant à l'autre partie. Les services de renseignement rendent rarement un prisonnier qui a encore des choses à dire - attendez-vous à le payer ailleurs dans le traité."
 adv_dip_repatriation_requires_prisoner_tt: "Le pays libérateur doit détenir au moins un agent capturé de l'autre partie."
 TREATY_ARTICLE_FLAG_IS_operative_repatriation_EFFECT: "Est un rapatriement d'agents"
 TREATY_DRAFT_ARTICLE_FLAG_IS_operative_repatriation_EFFECT: "Est un rapatriement d'agents"
 ADV_DIP_REPATRIATION_BARGAINING_CHIP: "Rendre un prisonnier qui a encore des choses à dire"
 ADV_DIP_REPATRIATION_BRING_THEM_HOME: "Ramener notre agent au pays"
 adv_dip_event.210.t: "Un homme dans leurs geôles"
 adv_dip_event.210.d: "[SCOPE.sCharacter('adv_dip_interrogated').GetFullName] a passé une année de plus aux mains de [SCOPE.sCountry('adv_dip_captor_country').GetName]. Ses interrogateurs sont patients, et chaque saison dans cette cellule est une saison où quelque chose pourrait être dit. Nous pouvons le racheter par traité, le rayer de nos registres, ou faire confiance à son silence."
 adv_dip_event.210.f: "Les rapports de la prison arrivent de seconde main et avec des mois de retard : le prisonnier est vivant, le prisonnier est interrogé, le prisonnier n'a rien dit. C'est la troisième affirmation que personne ne peut vérifier."
 adv_dip_event.210.a: "Il ne dira rien."
 adv_dip_event.210.b: "Désavouez-le."
 adv_dip_interrogation_held_tt: "Notre agent a gardé le silence - cette année."
 adv_dip_disavow_tt: "L'agent est rayé du service et abandonné à son sort. Le risque annuel d'interrogatoire s'éteint avec lui."
 adv_dip_network_rolled_up_tt: "#N Notre agent a parlé. Un réseau visant son geôlier est démantelé.#!"
 adv_dip_seasoned: "Aguerri"
 adv_dip_seasoned_desc: "Un an sur le terrain. #P +15% de réussite mensuelle des opérations.#! Touche le double du salaire de base."
 adv_dip_veteran: "Vétéran"
 adv_dip_veteran_desc: "Trois ans sous d'autres noms. #P +30% de réussite mensuelle#! et #P moitié moins de risque de capture#! quand un complot s'effondre. Touche un salaire conséquent."
 adv_dip_master_spy: "Maître espion"
 adv_dip_master_spy_desc: "Six ans sur le terrain, et toujours vivant. #P +45% de réussite mensuelle#!, #P moitié moins de risque de capture#!, et #P ne parle jamais sous interrogatoire#!. Touche un salaire princier."
 adv_dip_recruit_tt: "Un nouvel agent doté d'une spécialité aléatoire rejoint le service."
 adv_dip_master_silence_tt: "#P Un maître espion ne parle pas. Ses interrogateurs n'ont rien appris.#!"
 ADV_DIP_CONSOLE_OP_COST_TT: "L'entretien mensuel de cette opération, proportionné à l'économie de la cible. Le salaire de l'agent s'y ajoute."
 ADV_DIP_CONSOLE_AGENT_TT: "L'agent qui dirige ce réseau."
 ADV_DIP_CONSOLE_WAGE_TT: "Salaire mensuel, proportionné à notre économie et à l'expérience de l'agent. Prélevé directement sur le trésor avec tous les autres coûts d'espionnage - rien n'est visible aux puissances étrangères."
