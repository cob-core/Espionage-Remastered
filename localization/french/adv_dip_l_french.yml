 false_flag_directive_action_notification_desc: "Nos services de renseignement feront désormais accuser [TARGET_COUNTRY.GetName] de nos opérations."
 adv_dip_event.150.t: "Forceurs de blocus capturés"
 adv_dip_event.150.d: "Un de nos convois vers [SCOPE.sCountry('spy_target_country').GetName] a été intercepté. La cargaison est perdue — et chaque caisse saisie rapproche l'ennemi du nom de l'expéditeur."
 adv_dip_event.150.a: "La filière doit couler."
 adv_dip_event.151.t: "L'expéditeur démasqué"
 adv_dip_event.151.d: "Les manifestes récupérés le prouvent : [SCOPE.sCountry('pipeline_sponsor').GetName] arme notre ennemi depuis le début de cette guerre."
 adv_dip_event.151.a: "Exigez qu'ils cessent sur-le-champ."
 adv_dip_event.151.b: "Notez-le au registre des griefs."
 adv_dip_event.152.t: "Un ultimatum arrive"
 adv_dip_event.152.d: "[SCOPE.sCountry('pipeline_enemy').GetName] détient la preuve de notre filière et exige sa fermeture — publiquement, et sans délai."
 adv_dip_event.152.a: "Obtempérez. La partie est finie."
 adv_dip_event.152.b: "Refusez. Qu'ils écument."
 adv_dip_event.153.t: "L'arsenal de la victoire"
 adv_dip_event.153.d: "[SCOPE.sCountry('spy_target_country').GetName] a survécu à sa guerre — armé, pour une large part, par notre discrète générosité. Ils ne l'oublieront pas."
 adv_dip_event.153.a: "Ils nous doivent tout."
 adv_dip_event.160.t: "Revue de contre-espionnage"
 adv_dip_event.160.d: "Nos opérations contre [SCOPE.sCountry('spy_target_country').GetName] semblent... sans friction. Trop, peut-être. La commission peut auditer le réseau — ou lui faire confiance."
 adv_dip_event.160.a: "Auditez tout."
 adv_dip_event.160.b: "Le réseau est sain. Confiance."
 adv_dip_event.161.t: "Fin de la supercherie"
 adv_dip_event.161.d: "Notre triomphe de contre-espionnage s'achève : la commission de [SCOPE.sCountry('spymaster').GetName] a enfin percé le réseau que nous avions retourné contre eux."
 adv_dip_event.161.a: "Ce fut profitable tant que cela dura."
 adv_dip_event.163.t: "Opérations en cours"
 adv_dip_event.163.d: "Notre réseau en [SCOPE.sCountry('spy_target_country').GetName] signale des progrès réguliers. Les dépenses continuent comme prévu."
 adv_dip_event.163.a: "Excellent travail."
 adv_dip_event.165.t: "Maîtres de la guerre de l'ombre"
 adv_dip_event.165.d: "Dans les chancelleries et les antichambres du monde, un consensus discret : aucun service de renseignement ne rivalise actuellement avec le nôtre."
 adv_dip_event.165.a: "Et ils ne nous verront jamais venir."
 adv_dip_event.166.t: "Éclipsés dans l'ombre"
 adv_dip_event.166.d: "Notre service n'est plus cité comme le meilleur du monde. Une autre puissance donne désormais le tempo du Grand Jeu."
 adv_dip_event.166.a: "Nous reprendrons le titre."
 adv_dip_event.170.t: "Le wagon plombé"
 adv_dip_event.170.d: "Le wagon plombé passe la frontière cette nuit. À bord : un révolutionnaire, un faux passeport, et une allumette pour la poudrière de [SCOPE.sCountry('spy_target_country').GetName]."
 adv_dip_event.170.a: "Allumez la mèche."
 adv_dip_event.171.t: "Le retour du tribun"
 adv_dip_event.171.d: "Un agitateur notoire s'est glissé de nouveau dans notre pays, et toutes les salles de réunion mécontentes le savent. Le mouvement a trouvé sa voix."
 adv_dip_event.171.a: "Qui l'a laissé entrer ?"
 adv_dip_event.172.t: "Le courrier arrêté"
 adv_dip_event.172.d: "Notre police des frontières a arrêté un révolutionnaire financé par l'étranger. La révélation du complot a rallié les partisans de l'ordre."
 adv_dip_event.172.a: "Faites un exemple des conspirateurs."
 adv_dip_event.175.t: "Preuves d'agents étrangers"
 adv_dip_event.175.d: "Nos enquêteurs ont remonté la piste de l'espionnage. Les preuves désignent [SCOPE.sCountry('framed_patsy').GetName] — chaque document, chaque paiement, chaque trace."
 adv_dip_event.175.a: "Alors ils en répondront."
 adv_dip_event.176.t: "La supercherie se défait"
 adv_dip_event.176.d: "Nous sommes accusés à tort : l'espionnage qu'on nous impute est l'œuvre de [SCOPE.sCountry('spymaster').GetName], qui a contrefait nos empreintes sur ses crimes."
 adv_dip_event.176.a: "Cette infamie ne sera pas oubliée."
 adv_dip_event.180.t: "Un dossier constitué"
 adv_dip_event.180.d: "Nos réseaux en [SCOPE.sCountry('spy_target_country').GetName] ont assemblé un dossier accablant sur [SCOPE.sCharacter('kompromat_target').GetFullName]. Comment le dépenser ?"
 adv_dip_event.180.a: "Déshonorez-les — un scandale qui dévorera leur année."
 adv_dip_event.180.b: "Ruinez-les — mettez fin à la carrière."
 adv_dip_event.180.c: "Publiez sélectivement — humiliez le gouvernement."
 adv_dip_event.181.t: "Le scandale s'estompe"
 adv_dip_event.181.d: "Les journaux sont passés à autre chose, et [SCOPE.sCharacter('kompromat_target').GetFullName] a discrètement repris ses fonctions."
 adv_dip_event.181.a: "Pour l'instant."
