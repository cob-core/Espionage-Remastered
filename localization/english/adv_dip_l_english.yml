 # v4.1 flavour text
 adv_dip_event.150.f: "The harbormaster's report was read aloud in a closed session. The steamer had been flying a neutral flag and carrying grain, according to her papers. Under the grain were rifle crates stamped with serial numbers our arsenal had failed to file off.\n\nThe captain and crew are held in a foreign port. Their silence is bought and paid for, but the cargo speaks for itself."
 adv_dip_event.151.f: "The naval prize court catalogued everything: rifles, shells, boots, and a ledger the smugglers should have burned.\n\n\"Payments drawn on accounts we have traced,\" the intelligence officer reported. \"Routing orders in a cipher we broke last spring. There is no doubt about the sender.\" The foreign minister closed the folder and asked for the ambassador to be summoned."
 adv_dip_event.152.f: "The ambassador did not sit. He placed a photograph of the captured manifests on the desk and read a prepared statement in a level voice.\n\nHis government demanded a public renunciation of the shipments, publication of the order in our own press, and an end to all traffic within the month. The alternative was left carefully undescribed."
 adv_dip_event.153.f: "The victory parade passed beneath windows we paid for, past guns we shipped and boots we bought, and none of the crowds knew it.\n\nTheir chancellor knows it. His first private letter after the armistice thanked us in terms that will never be published, and promised that the debt would be remembered."
 adv_dip_event.160.f: "The station chief's reports arrive on schedule, written in the same steady hand. The payments clear. The sources answer every question we put to them.\n\n\"That is the problem,\" the review officer said. \"No source is this reliable. Either we have the finest network in the world, or someone else is writing their answers.\""
 adv_dip_event.161.f: "The audit team worked backwards through three years of reporting and found the seam: a customs figure our agents had reported faithfully, which the port's own published records contradicted.\n\nEvery report after that date is now presumed dictated. The office that celebrated those reports must now calculate what was surrendered in exchange for them."
 adv_dip_event.163.f: "The courier delivered the usual envelope by the usual route. Payroll accounts, requisition summaries, a note on morale in the southern garrisons.\n\nIt was read, filed, and circulated to the general staff, who found nothing in it to question."
 adv_dip_event.165.f: "There was no announcement and no ceremony. The recognition arrived in smaller ways: a rival service quietly doubling its counterintelligence budget, an ambassador who chooses his dinner conversation more carefully, a cipher clerk in a foreign ministry who now works behind two locked doors.\n\nThey have all reached the same conclusion about us."
 adv_dip_event.166.f: "Our station chiefs report the same pattern from three capitals. Sources going quiet. Dead drops left untouched. A defector who changed his mind at the last moment.\n\nSomeone else is paying better, moving faster, and asking our questions before we do."
 adv_dip_event.170.f: "The carriage was coupled to the night express with its blinds drawn and its door sealed by a customs officer who had been paid to seal it and ask nothing.\n\nInside, the passenger read by a shaded lamp and made notes in the margins of a pamphlet that is banned in the country he is returning to."
 adv_dip_event.171.f: "The first speech was given in a rented hall above a printing shop, to an audience of forty. The second filled a warehouse.\n\nThe police broke up the third meeting, which had been the intention. Word of the arrest warrant did more for attendance than any pamphlet could."
 adv_dip_event.172.f: "The border inspector became suspicious of a passport that was too new for the man carrying it. The sealed carriage was opened on a siding, under guard.\n\nThe prisoner gave a false name, then a second one, and then stopped talking. The newspapers were not so reticent. By week's end every loyal society in the country had held a rally against foreign subversion."
 adv_dip_event.175.f: "Each thread was followed to its end: the bank drafts, the forged permits, the safe-house lease signed by a consular clerk.\n\nEvery one of them terminates in the same capital. The investigators presented their findings with professional satisfaction, unaware they were reading a script written for them."
 adv_dip_event.176.f: "A single mistake undid the whole construction. A forged bank draft carried a watermark from a paper mill that had burned down two years before the date it bore.\n\nFrom that one thread the entire fabrication unwound, and at the end of it stood the true author, exposed before both his victims at once."
 adv_dip_event.180.f: "The dossier is a plain folder tied with string. Inside are photographs, a hotel register, four promissory notes, and a letter whose author would pay any price to have it back.\n\nIt sits in a locked drawer while we decide what it is worth."
 adv_dip_event.181.f: "The affair burned through the season's newspapers and then, as affairs do, it was replaced by fresher scandal.\n\nThe officer's clubs readmitted him. His command was restored with a discretion that spared everyone involved. Only his creditors remember the details."
 # Fund Black Market Slavery
