 operative_repatriation: "Operative Repatriation"
 operative_repatriation_desc: "The signatory returns every captured operative it holds belonging to the other party. Intelligence services rarely give up a prisoner who still has things to say - expect to pay for it elsewhere in the treaty."
 adv_dip_repatriation_requires_prisoner_tt: "The releasing country must hold at least one of the other party's captured operatives."
