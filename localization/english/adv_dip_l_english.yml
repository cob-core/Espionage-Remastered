# # # # # DEVELOPMENT JOURNAL # # # # #
adv_dip_je_development: "Building Blocks"
adv_dip_je_development_reason: "Our nation is assisting [SCOPE.gsCountry('target').GetName] in its development. We are providing them with the necessary resources to modernise their industry, military, and society. This will not only help them catch up with us but also strengthen our ties with them.\n\nHowever, we must ensure that this assistance does not lead to them becoming a rival power. We need to maintain our influence over their development and ensure that they remain dependent on us for technological advancements."

adv_dip_je_share_technologies: "Share Technologies"
adv_dip_je_share_technologies_desc: "Send engineers and blueprints to accelerate the nation's development."

adv_dip_je_development_success: "The development program is a success."

development_progress_bar: "Development Progress"
development_progress_bar_desc: "Development Progress"
DEVELOPMENT_PROGRESS_BAR_MONTHLY_PROGRESS_DESC: "Natural Monthly Development"

adv_dip_je_encourage_settlers: "Encourage Settlers"
adv_dip_je_encourage_settlers_desc: "Encourages settlers to move to [SCOPE.gsCountry('target').GetName]. This will help them develop their industry and society, but it may also lead to tensions with the local population."
adv_dip_je_garner_influence: "Garner Influence"
adv_dip_je_garner_influence_desc: "Garner influence in [SCOPE.gsCountry('target').GetName] to ensure that our development program is successful. This will help us maintain our influence over their development and ensure that they remain dependent on us for technological advancements."

development_encourage_settlers_modifier: "Encouraging Settlers"
development_garner_influence_modifier: "Garnering Influence"

