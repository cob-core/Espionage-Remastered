 adv_dip_event.200.t: "A Question of Personnel"
 adv_dip_event.200.d_sow_discontent: "The campaign of unrest we intend for [SCOPE.sCountry('spy_target_country').GetName] will need a steady hand on the ground - someone to find the grievances, fund the pamphlets, and stay invisible while doing it."
 adv_dip_event.200.d_support_nationalists: "Our support for the nationalists in [SCOPE.sCountry('spy_target_country').GetName] must flow through a single trusted intermediary. Money, arms and promises all require a courier who cannot be traced back to us."
 adv_dip_event.200.d_agitate_for_liberty: "Someone must carry our encouragement to the liberals of [SCOPE.sCountry('spy_target_country').GetName] - and be forgotten by everyone they meet."
 adv_dip_event.200.d_steal_technology: "The technical secrets of [SCOPE.sCountry('spy_target_country').GetName] will not photograph themselves. This assignment needs patience, access, and a very good memory."
 adv_dip_event.200.d_sabotage_recruitment: "Recruiting sergeants can be bribed, muster rolls can be lost, and depots can burn. Someone must arrange all three in [SCOPE.sCountry('spy_target_country').GetName] without ever being seen."
 adv_dip_event.200.d_election_interference: "Elections in [SCOPE.sCountry('spy_target_country').GetName] are a market like any other, and we intend to be a discreet buyer. Who manages our purse there?"
 adv_dip_event.200.d_steal_commander: "Somewhere in [SCOPE.sCountry('spy_target_country').GetName] is an officer worth more to us than to them. The approach must be made carefully, and by exactly one person."
 adv_dip_event.200.d_clandestine_arms_pipeline: "Crates mislabelled, manifests rewritten, border guards persuaded - a pipeline into [SCOPE.sCountry('spy_target_country').GetName] needs a quartermaster with no official existence."
 adv_dip_event.200.d_fund_black_market_slavery: "The traffickers supplying [SCOPE.sCountry('spy_target_country').GetName] deal only face to face. If we mean to finance them, someone must sit at that table and shake those hands."
 adv_dip_event.200.d_support_slaves: "Guides, safe houses and forged papers along the escape routes of [SCOPE.sCountry('spy_target_country').GetName] - the network exists, but it needs an organiser we can trust with silence."
 adv_dip_event.200.d_naval_intelligence: "Harbour charts, gunnery trials, the tempers of admirals - everything [SCOPE.sCountry('spy_target_country').GetName] knows about its own fleet, we intend to know too. Who builds the network?"
 adv_dip_event.200.d_sealed_train: "A revolutionary, a sealed carriage, and a border that must open at precisely the right moment. The escort for this journey into [SCOPE.sCountry('spy_target_country').GetName] cannot be chosen carelessly."
 adv_dip_event.200.d_develop_nation: "Advisors, engineers and quiet money for [SCOPE.sCountry('spy_target_country').GetName] - generosity, of a kind, but generosity that reports home. Someone must direct it."
 adv_dip_event.200.d_false_flag: "Evidence must be manufactured, planted, and discovered on schedule - all of it pointing at [SCOPE.sCountry('spy_target_country').GetName]. The forger of this particular trail must be beyond suspicion."
 adv_dip_event.200.x: "Call it off."
