 adv_dip_event.131.t: "A Commander Wavers"
 adv_dip_event.131.d: "After months of careful cultivation, our agents report that [SCOPE.sCharacter('steal_commander_target').GetFullName], a commander in service of [SCOPE.sCountry('spy_target_country').GetName], may be persuaded to change allegiance — for the right assurances, and the right price."
 adv_dip_event.131.f: "The meeting took place in a private box at the opera, where conversation could drown beneath the orchestra. \n\n\"The commander is... receptive,\" our agent reported. \"Passed over for promotion, insulted by the general staff, and married to a spouse with expensive tastes. Every grievance is a door, and this one stands ajar.\" \n\nWhat remained was the question of what to do with such an asset. Spirit them across the border to take up a commission under our flag? Leave them in place, feeding us the doctrine and dispositions of their masters? Or close the file and admit the risk outweighs the prize?"
 adv_dip_event.131.a: "Bring [SCOPE.sCharacter('steal_commander_target').GetFullName] over to us."
 adv_dip_event.131.b: "More useful where they are."
 adv_dip_event.131.c: "Close the file."
 adv_dip_event.132.t: "Defection!"
 adv_dip_event.132.d: "One of our commanders has defected to [SCOPE.sCountry('defection_beneficiary').GetName]. The officer corps is in uproar, and questions are being asked about who allowed foreign agents such intimate access to our military."
 adv_dip_event.132.f: "The commander's quarters were found in perfect order — uniforms pressed, sword mounted on the wall, and a single letter of resignation weighted beneath an empty inkwell. \n\nBy the time the alarm was raised, the defector was already across the border, greeted — according to our furious attachés — with a formal commission and a comfortable estate. \n\nThe damage is not merely one empty command. Every officer who served alongside the traitor is now suspect, every war plan they touched compromised. The general staff demands answers we do not have."
 adv_dip_event.132.a: "Treachery!"
