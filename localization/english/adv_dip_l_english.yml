 adv_dip_event.155.t: "The Middle Passage, Underwritten"
 adv_dip_event.155.d: "Our payments to the contraband traders supplying [SCOPE.sCountry('spy_target_country').GetName] have come due. The trade is profitable for everyone except the cargo, and increasingly dangerous for its financiers."
 adv_dip_event.155.f: "The accounts are kept in a shipping office that officially deals in palm oil. Fast hulls, foreign registries, captains paid in gold and silence.\n\nThe suppression squadrons grow bolder each season. Every ship they board is a ledger they might read, and some of those ledgers lead here."
 adv_dip_event.155.a: "The trade must continue."
 adv_dip_event.155.b: "This has become too dangerous. End it."
 adv_dip_event.156.t: "The Financier Exposed"
 adv_dip_event.156.d: "Papers taken from a captured slave ship prove that [SCOPE.sCountry('spymaster_slaver').GetName] has been financing the contraband trade. The civilized world takes note."
 adv_dip_event.156.f: "The boarding party found the usual horror below decks, and something rarer in the captain's cabin: bills of exchange, insurance papers, and letters of credit, all traceable.\n\nThe prize court published every name. Editorials followed in a dozen capitals, and ministers who had shaken the financier's hand now deny having met him."
 adv_dip_event.156.a: "Monstrous."
 black_market_quiet_tt: "The ships land their cargo unmolested."
 black_market_intercepted_tt: "#N A suppression squadron has taken one of our ships. The trail of evidence grows.#!"
 black_market_backlash_tt: "#v The black market trade supplying this country makes our liberation work easier to spread.#!"
