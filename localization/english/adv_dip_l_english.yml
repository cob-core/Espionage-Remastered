 adv_dip_event.210.t: "A Man in Their Cells"
 adv_dip_event.210.d: "[SCOPE.sCharacter('adv_dip_interrogated').GetFullName] has spent another year in the custody of [SCOPE.sCountry('adv_dip_captor_country').GetName]. Their interrogators are patient, and every season in that cell is a season in which something might be said. We can ransom them back by treaty, write them off entirely, or trust their silence."
 adv_dip_event.210.f: "The reports from the prison arrive second-hand and months late: the prisoner is alive, the prisoner is being questioned, the prisoner has said nothing. It is the third claim that no one can verify."
 adv_dip_event.210.a: "They will say nothing."
 adv_dip_event.210.b: "Disavow them."
 adv_dip_interrogation_held_tt: "Our operative held their silence - this year."
 adv_dip_disavow_tt: "The operative is struck from the service and abandoned to their fate. The yearly interrogation risk ends with them."
 adv_dip_network_rolled_up_tt: "#N Our operative has talked. A network against their captor is rolled up.#!"
 adv_dip_seasoned: "Seasoned"
 adv_dip_seasoned_desc: "A year in the field. #P +15% monthly operation success.#! Commands double the base wage."
 adv_dip_veteran: "Veteran"
 adv_dip_veteran_desc: "Three years under other names. #P +30% monthly operation success#! and #P half the usual capture risk#! when a plot collapses. Commands a substantial wage."
 adv_dip_master_spy: "Master Spy"
 adv_dip_master_spy_desc: "Six years in the field and still alive. #P +45% monthly operation success#!, #P half the usual capture risk#!, and #P never talks under interrogation#!. Commands a princely wage."
 adv_dip_recruit_tt: "A new operative with a random tradecraft specialty joins the roster."
 adv_dip_master_silence_tt: "#P A master spy does not talk. Their interrogators learned nothing.#!"
 ADV_DIP_CONSOLE_OP_COST_TT: "This operation's monthly upkeep, scaled to the target's economy. The assigned operative's wage is on top."
 ADV_DIP_CONSOLE_AGENT_TT: "The operative running this network."
 ADV_DIP_CONSOLE_WAGE_TT: "Monthly wage, scaled to our economy, the operative's experience, and the government wage level. Charged directly from the treasury - nothing is visible to foreign powers. At low government wages, idle operatives risk defecting to hostile powers each year."
 adv_dip_flip_option: "Move against their agent."
 adv_dip_flip_attempt_tt: "Our counterespionage service will try to take the agent running this network. Success follows the espionage institution edge. Either way, their network here is finished - the only question is whether their agent leaves in our custody or over the border."
 adv_dip_event.215.t: "An Agent in Hand"
 adv_dip_event.215.d: "The safehouse was watched for a week before the door went in. [SCOPE.sCountry('adv_dip_flip_spymaster_scope').GetName]'s agent sits across the table now, papers spread between us, and what happens next is entirely our choice."
 adv_dip_event.215.f: "The arrest report runs to a page and a half. The inventory of the safehouse runs to eleven: ciphers, receipts, names. It is the receipts that will matter."
 adv_dip_event.215.a: "Leave them in place."
 adv_dip_event.215.b: "Parade the spy before the world."
 adv_dip_event.215.c: "A quiet cell."
 adv_dip_event.216.t: "An Empty Safehouse"
 adv_dip_event.216.d: "The door went in at dawn and found yesterday's ashes in the grate. [SCOPE.sCountry('adv_dip_flip_spymaster_scope').GetName]'s agent was warned, or lucky, or better than we judged - but their network here is burned all the same."
 adv_dip_event.216.f: "The stationmaster remembers a traveller with light luggage and correct papers. By the time the description circulated, the border was four hours behind them."
 adv_dip_event.216.a: "Next time."
 adv_dip_flip_captured_tt: "#P Their agent is in our cells#! - a prisoner their master must ransom by treaty, disavow, or leave to us. The network against us is rolled up."
 adv_dip_flip_escaped_tt: "Their agent slipped away home, but the network against us is rolled up."
 adv_dip_event.81.a: "Open the ballot ledger."
 adv_dip_event.81.x: "On second thought, stay out of it."
 adv_dip_election_console_tt: "Choose which party to back from the ballot section of the intelligence console (the Shadow War journal entry). The choice lapses if the campaign ends first."
 adv_dip_election_declined_tt: "We sit this election out. Nothing is spent."
 adv_dip_event.220.t: "The Director Defects"
 adv_dip_event.220.d: "[SCOPE.sCharacter('adv_dip_spurned_director').GetFullName] did not go quietly. Word comes that they have offered their services - and their memory - to [SCOPE.sCountry('adv_dip_captor_country').GetName]."
 adv_dip_event.220.f: "The letter of resignation was three lines and correct in every particular. The luggage was heavier than three lines deserved."
 adv_dip_event.220.a: "Every lock they had a key to must be changed."
 adv_dip_defector_nothing_tt: "Whatever they carried, we ran nothing against their new patron that could be betrayed."
 adv_dip_spurned_service_modifier: "Spurned by the Government"
 ADV_DIP_CONSOLE_BUDGET_LABEL: "Monthly agency budget"
 ADV_DIP_CONSOLE_BUDGET_TT: "The service's full monthly cost: operation upkeep plus every wage from rookie to Director. Charged directly from the treasury - nothing about it is visible to foreign powers."
 adv_dip_director_post_filled_tt: "The post is filled. To replace a sitting Director you must dismiss them first - and dismissed Directors do not always go quietly."
 ADV_DIP_CONSOLE_BALLOT: "Pending Election Ballots"
 ADV_DIP_CONSOLE_BALLOT_HINT: "Choose a party to back"
 adv_dip_back_party_tt: "Our money floods this party's campaign: a surge of momentum, applied without a trace. There is a small chance the interference is discovered - a public scandal that shakes the target's electoral confidence and names us."
 adv_dip_event.225.t: "Foreign Hands on the Ballot"
 adv_dip_event.225.d: "The newspapers have it, and by tomorrow every constituency will: foreign money - [SCOPE.sCountry('spymaster').GetName]'s money - has been moving through our election. Whatever the count now says, half the country will not believe it."
 adv_dip_event.225.f: "The pamphlet that broke the story cost a penny. Tracing the funds it described had cost a clerk in the interior ministry four months, a borrowed ledger, and very nearly his nerve."
 adv_dip_event.225.a: "The ballot must be defended."
 adv_dip_tainted_election_modifier: "Tainted Election"
 adv_dip_tainted_election_modifier_desc: "Proof of foreign interference has shaken public confidence in the ballot. Legitimacy suffers and radical movements find ready ears."
 adv_dip_appoint_director_tt: "Promotes this operative to Director of Intelligence. They leave field rotation, draw an executive salary, and grant the service its bonus while seated."
 adv_dip_event.157.t: "The Convoy Got Through"
 adv_dip_event.157.d: "Another shipment has landed in [SCOPE.sCountry('spy_target_country').GetName] - crates delivered, invoices burned, and the blockade none the wiser. The pipeline holds."
 adv_dip_event.157.f: "The manifest said agricultural machinery. The customs officer who did not open the crates dined well that week, and the war went on being supplied."
 adv_dip_event.157.a: "Keep the crates moving."
 adv_dip_pipeline_delivered_tt: "The war materiel arrived unseen. Our client remembers who keeps them fighting."
 adv_dip_event.230.t: "The Sealed Train Waits"
 adv_dip_event.230.d: "The route is arranged, the carriage is paid for, and the border will open at the right moment. All that remains is the passenger: the exile whose return will do the most damage."
 adv_dip_event.230.f: "The stationmaster was told to expect freight of unusual value and ask nothing further. He has been asked to forget more interesting cargo."
 adv_dip_event.230.a: "Review the manifest."
 adv_dip_event.230.x: "No one rides. Cancel the arrangement."
 adv_dip_smuggle_console_tt: "Choose the revolutionary from the Sealed Train section of the intelligence console (the Shadow War journal entry). The arrangement holds for six months."
 adv_dip_smuggle_declined_tt: "The carriage returns empty. The arrangement is cancelled."
 ADV_DIP_CONSOLE_SMUGGLE: "Sealed Train: Choose the Passenger"
 adv_dip_smuggle_pick_tt: "This exile boards the sealed train into the target country, and the ferment begins with them."
 adv_dip_event.235.t: "Sold for Back Pay"
 adv_dip_event.235.d: "[SCOPE.sCharacter('adv_dip_defector').GetFullName] has stopped reporting. The last anyone saw of them was a first-class ticket and a new coat - and word now comes that [SCOPE.sCountry('adv_dip_captor_country').GetName] has been asking remarkably well-informed questions. A service paid in promises keeps its secrets the same way."
 adv_dip_event.235.f: "The resignation letter was never written. The expense claims, unpaid for eleven months, were left squared on the desk - a bookkeeper's farewell, and an itemized justification."
 adv_dip_event.235.a: "Pay the rest before they follow."
 adv_dip_wage_defection_tt: "#N An underpaid operative has defected#! and their buyer now knows our hand. Raising the government wage level ends the yearly defection risk."
 adv_dip_event.236.t: "A Walk-In at the Legation"
 adv_dip_event.236.d: "An operative of [SCOPE.sCountry('adv_dip_spymaster_country').GetName] sits in an anteroom of our legation with a valise of papers and eleven months of unpaid wages. For the right price, everything their service runs against us is ours to read."
 adv_dip_event.236.f: "The valise was inventoried twice before anyone believed it. Cipher tables, courier schedules, the true name of a man three of our ministries knew under four others."
 adv_dip_event.236.a: "Pay for the dossier."
 adv_dip_event.236.b: "Pay for the dossier - and the man who wrote it."
 adv_dip_event.236.x: "Turn the traitor away."
 adv_dip_pay_defector_tt: "#P Every operation their service runs against us is revealed and rolled up.#! The defector takes the money and vanishes."
 adv_dip_poach_defector_tt: "#P Every operation against us is revealed and rolled up - and the defector joins our roster#! with all their experience."
 adv_dip_refuse_defector_tt: "We buy nothing and learn nothing. There is a chance their own service catches wind of the attempt."
 adv_dip_event.235.d_poached: "[SCOPE.sCharacter('adv_dip_defector').GetFullName] has stopped reporting - because they now report to [SCOPE.sCountry('adv_dip_captor_country').GetName]. Our networks there are ash, and our former colleague is drawing a foreign salary. A service paid in promises keeps its secrets the same way."
 adv_dip_event.237.t: "The Traitor Comes Home"
 adv_dip_event.237.d: "[SCOPE.sCharacter('adv_dip_defector').GetFullName] was seen entering a foreign legation with a full valise and leaving with it unopened. They do not know they were seen. What they were offering can be guessed from the eleven months of wages we have not paid them."
 adv_dip_event.237.f: "The watcher's report is a single paragraph, and its last sentence has been underlined twice by some careful hand: 'The valise appeared no lighter on departure.'"
 adv_dip_event.237.a: "Cashier them quietly."
 adv_dip_event.237.b: "Pay their arrears. Loyalty has a price."
 adv_dip_cashier_traitor_tt: "The operative is struck from the service before they can try a second door."
 adv_dip_pay_arrears_tt: "Their back pay is settled and the matter is never spoken of. They remain in service."
 adv_dip_all_networks_rolled_up_tt: "#N Every network against the buyer is rolled up.#!"
 adv_dip_event.238.t: "The Spark Catches"
 adv_dip_event.238.d: "Word crosses the border by the usual indirect roads: the passenger arrived, the speeches have begun, and the police are already too late. The ferment is theirs to enjoy now."
 adv_dip_event.238.d_named: "Word crosses the border by the usual indirect roads: [SCOPE.sCharacter('smuggled_revolutionary').GetFullName] arrived safely, the speeches have begun, and the police are already too late. The ferment is theirs to enjoy now."
 adv_dip_event.238.f: "The first pamphlet reached us folded inside a butter wrapper. The print run, our friend writes, sold out in a day."
 adv_dip_event.238.a: "Let it burn."
 adv_dip_train_success_result_tt: "#P The revolutionary is in place.#! The target country faces years of ferment - and the operation was worth every mark."
 adv_dip_event.239.t: "Arrested at the Border"
 adv_dip_event.239.d: "The carriage was opened at the frontier and the passenger taken on the platform. The border guards knew which compartment to check - and the newspapers will know whose arrangement it was by morning."
 adv_dip_event.239.d_named: "The carriage was opened at the frontier and [SCOPE.sCharacter('smuggled_revolutionary').GetFullName] was taken on the platform. The border guards knew which compartment to check - and the newspapers will know whose arrangement it was by morning."
 adv_dip_event.239.f: "The stationmaster who was paid to forget has remembered everything, at length and under oath."
 adv_dip_event.239.a: "Burn the manifests."
 adv_dip_train_failure_result_tt: "#N The smuggling failed.#! The passenger is in their hands, our name is in the papers, and the target has begun a crackdown."
