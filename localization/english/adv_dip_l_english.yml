 adv_dip_event.150.t: "Blockade Runners Caught"
 adv_dip_event.150.d: "One of our supply convoys to [SCOPE.sCountry('spy_target_country').GetName] has been intercepted. The cargo is lost, and the seized crates may eventually be traced back to us."
 adv_dip_event.150.a: "The pipeline must flow."
 adv_dip_event.151.t: "The Sender Named"
 adv_dip_event.151.d: "Manifests recovered from captured blockade runners prove that [SCOPE.sCountry('pipeline_sponsor').GetName] has been supplying our enemy throughout this war."
 adv_dip_event.151.a: "Demand they cease at once."
 adv_dip_event.151.b: "Note it in the ledger of grievances."
 adv_dip_event.152.t: "An Ultimatum Arrives"
 adv_dip_event.152.d: "[SCOPE.sCountry('pipeline_enemy').GetName] has proof of our arms shipments and demands that we stop them publicly and at once."
 adv_dip_event.152.a: "Comply. The game is up."
 adv_dip_event.152.b: "Refuse. Let them fume."
 adv_dip_event.153.t: "The Arsenal Behind the Victory"
 adv_dip_event.153.d: "[SCOPE.sCountry('spy_target_country').GetName] has survived its war, armed in large part by our secret support. Their government knows what it owes us."
 adv_dip_event.153.a: "They owe us everything."
 adv_dip_event.160.t: "Counterintelligence Review"
 adv_dip_event.160.d: "The intelligence service has raised doubts about our network in [SCOPE.sCountry('spy_target_country').GetName]. Operations report success, yet results are thin. We can order a full audit, or leave the network alone."
 adv_dip_event.160.a: "Audit everything."
 adv_dip_event.160.b: "The network is sound. Trust it."
 adv_dip_event.161.t: "The Deception Ends"
 adv_dip_event.161.d: "Our counterintelligence triumph is over: [SCOPE.sCountry('spymaster').GetName]'s review board has finally seen through the network we turned against them."
 adv_dip_event.161.a: "It was profitable while it lasted."
 adv_dip_event.163.t: "Operations Proceeding"
 adv_dip_event.163.d: "Our network in [SCOPE.sCountry('spy_target_country').GetName] reports steady progress. Expenses continue as planned."
 adv_dip_event.163.a: "Excellent work."
 adv_dip_event.165.t: "Master of the Great Game"
 adv_dip_event.165.d: "Foreign ministries across the world now regard our intelligence service as the most capable of its kind. That reputation is worth a great deal."
 adv_dip_event.165.a: "And they will never see us coming."
 adv_dip_event.166.t: "Eclipsed in the Shadows"
 adv_dip_event.166.d: "Our intelligence service is no longer considered the world's finest. Another power has overtaken us."
 adv_dip_event.166.a: "We will take the title back."
 adv_dip_event.170.t: "The Sealed Train"
 adv_dip_event.170.d: "The sealed carriage crosses the border into [SCOPE.sCountry('spy_target_country').GetName] tonight. It carries a single passenger travelling on false papers, and our hopes for their revolution."
 adv_dip_event.170.a: "Light the fuse."
 adv_dip_event.171.t: "A Firebrand Returns"
 adv_dip_event.171.d: "A notorious agitator has returned to our country and is addressing crowded meeting halls. Radical movements have taken new heart."
 adv_dip_event.171.a: "Who let them in?"
 adv_dip_event.172.t: "The Courier Caught"
 adv_dip_event.172.d: "Our border police have arrested a foreign-sponsored revolutionary at the frontier. The plot's exposure has rallied support for order."
 adv_dip_event.172.a: "Make an example of the conspirators."
 adv_dip_event.175.t: "Evidence of Foreign Agents"
 adv_dip_event.175.d: "Our investigators have traced the espionage against us. All of the recovered documents and payments point to [SCOPE.sCountry('framed_patsy').GetName]."
 adv_dip_event.175.a: "Then they will answer for it."
 adv_dip_event.176.t: "The Forgery Unravels"
 adv_dip_event.176.d: "We have been falsely accused. The espionage blamed on us was carried out by [SCOPE.sCountry('spymaster').GetName], who planted evidence against us."
 adv_dip_event.176.a: "This infamy will not be forgotten."
 adv_dip_event.180.t: "A Dossier Compiled"
 adv_dip_event.180.d: "Our agents in [SCOPE.sCountry('spy_target_country').GetName] have assembled a compromising dossier on [SCOPE.sCharacter('kompromat_target').GetFullName]. We must decide how to use it."
 adv_dip_event.180.a: "Disgrace them — a scandal that consumes their year."
 adv_dip_event.180.b: "Ruin them — end the career outright."
 adv_dip_event.180.c: "Publish selectively — humiliate the government."
 adv_dip_event.181.t: "The Scandal Fades"
 adv_dip_event.181.d: "The newspapers have moved on, and [SCOPE.sCharacter('kompromat_target').GetFullName] has quietly resumed their duties."
 adv_dip_event.181.a: "For now."
