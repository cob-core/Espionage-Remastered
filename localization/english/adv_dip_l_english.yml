 adv_dip_event.41.t: "Wrenches in the War Machine"
 adv_dip_event.41.d: "Our operatives inside [SCOPE.sCountry('spy_target_country').GetName] report that their recruitment apparatus is vulnerable. Falsified muster rolls, misdirected supply requisitions, and a few well-placed bribes could severely hamper their ability to raise troops."
 adv_dip_event.41.f: "The report arrived in a diplomatic pouch, wrapped in the mundane paperwork of a trade delegation. \n\n\"Their conscription bureau runs on paperwork and habit,\" our station chief wrote. \"A misplaced ledger here, a forged exemption there, and entire districts will simply fail to muster. Their drill sergeants will be training ghosts.\" \n\nThe Minister of War weighed the proposal. Such an operation would not be cheap — clerks must be bought, inspectors distracted, and the trail swept clean. But an enemy who cannot fill his regiments is an enemy half-beaten before the first shot."
 adv_dip_event.41.a: "Fund the operation."
 adv_dip_event.41.b: "Not at this price."
 adv_dip_event.42.t: "Empty Muster Rolls"
 adv_dip_event.42.d: "Something is deeply wrong with our military recruitment. Muster rolls list men who do not exist, requisitions vanish into thin air, and training grounds stand half-empty. This is no accident — foreign agents are at work."
 adv_dip_event.42.f: "The Inspector-General's audit made for grim reading. \n\n\"Three districts reported full musters — yet the barracks stand empty. Requisition orders for an entire training battalion were redirected to a warehouse that burned down years ago. Our drill instructors report recruits who never arrive.\" \n\nThe pattern was too consistent for incompetence. Somewhere in the machinery of recruitment, foreign hands were pulling levers, and every day of delay left another regiment understrength."
 adv_dip_event.42.a: "We must simply endure it."
 adv_dip_event.42.b: "Fund counter-intelligence sweeps."
