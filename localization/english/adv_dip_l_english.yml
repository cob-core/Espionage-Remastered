 # v4.0 Naval Set — events
 adv_dip_event.140.t: "The Network Takes Shape"
 adv_dip_event.140.d: "Our intelligence service has identified the first cracks in [SCOPE.sCountry('naval_intel_target').GetName]'s admiralty — a clerk with debts, a signals officer passed over, a chartroom left unlocked. A patient network could turn these cracks into a breach."
 adv_dip_event.140.f: "The file was thin, but promising. \n\n\"Their naval establishment believes itself impenetrable,\" the intelligence director explained. \"That very confidence is our opening. Nobody watches the man who watches the harbor.\" \n\nApproval would commit us to months — perhaps years — of patient cultivation, with funding flowing to informants whose names we would never know. But at the end of that road: their codes, their charts, their fleet laid bare."
 adv_dip_event.140.a: "Begin the infiltration."
 adv_dip_event.141.t: "The Dockyard Clerk"
 adv_dip_event.141.d: "A junior clerk in the target's naval yards has begun passing us requisition schedules — small beer, but every document maps the harbor a little better."
 adv_dip_event.141.f: "He asked for so little — gambling debts cleared, nothing more. In exchange: berthing schedules, coal allocations, the daily rhythm of a fleet at anchor. \n\nNo single page mattered. Together, they were a portrait."
 adv_dip_event.141.a: "Every little helps."
 adv_dip_event.142.t: "The Signals Intercept"
 adv_dip_event.142.d: "Our agents have obtained partial copies of the target's signal book. Exploiting them aggressively would speed the infiltration — but signals officers notice when their codes leak."
 adv_dip_event.142.f: "Three pages, photographed by lamplight in a hotel room while their courier slept off a carefully funded evening. \n\n\"We can read perhaps a third of their routine traffic,\" the cryptographer estimated. \"If we act on what we read, they will eventually deduce the leak. If we merely listen, we learn more slowly — but they suspect nothing.\""
 adv_dip_event.142.a: "Exploit them aggressively."
 adv_dip_event.142.b: "Listen quietly."
 adv_dip_event.143.t: "The Admiral's Valet"
 adv_dip_event.143.d: "A rare opportunity: a valet in the naval staff's inner household is willing to photograph documents from his master's dispatch box — for a price, and at tremendous risk."
 adv_dip_event.143.f: "\"The dispatch box sits unlocked for perhaps ten minutes each evening while the admiral dresses for dinner,\" the recruiter reported. \"The valet is willing. He is also terrified, and terrified men make mistakes.\" \n\nThe haul could be extraordinary — fleet dispositions, war plans, the minutes of the naval staff itself. The risk of a trembling hand knocking over a lamp was equally extraordinary."
 adv_dip_event.143.a: "The prize is worth the candle."
 adv_dip_event.143.b: "Too dangerous."
 adv_dip_event.144.t: "Counterintelligence Sweep"
 adv_dip_event.144.d: "The target's naval counterintelligence has begun questioning dockyard personnel. Our network holds its breath."
 adv_dip_event.144.f: "The interrogations were methodical: every clerk with new shoes, every officer whose mess bills exceeded his pay. \n\n\"They have no names yet,\" our station chief wrote. \"But they know someone is inside. We can ride it out and hope, or we can go to ground and lose months of work.\""
 adv_dip_event.144.a: "Hold fast."
 adv_dip_event.144.b: "Go to ground."
 adv_dip_event.145.t: "The Drunken Attaché"
 adv_dip_event.145.d: "One of our own naval attachés, deep in his cups at a legation dinner, boasted of knowing the target fleet's movements. Their counterintelligence was listening."
 adv_dip_event.145.f: "The toast had been one too many. By morning, the attaché remembered only fragments of the evening; the target's intelligence service, unfortunately, had transcribed the rest. \n\nRecall and disgrace for the fool were straightforward. The harder question was how much of the network his vanity had illuminated."
 adv_dip_event.145.a: "Recall the fool."
 adv_dip_event.146.t: "The Harbor Photographer"
 adv_dip_event.146.d: "A commercial photographer with a studio overlooking the target's naval anchorage has agreed to sell us his 'landscape studies' — and their fleet sits in every frame."
 adv_dip_event.146.f: "Officially, he photographed sunsets. That his balcony overlooked the fitting-out basin, and that his sunsets happened to capture every new hull at its moorings, was merely artistic coincidence. \n\nHis prices were steep for landscapes. For fleet photography, they were a bargain — though a man who sells to one buyer will eventually sell to two."
 adv_dip_event.146.a: "Buy the collection."
 adv_dip_event.148.t: "The Network Strikes"
 adv_dip_event.148.d: "Years of patient work inside [SCOPE.sCountry('naval_intel_target').GetName]'s admiralty have come to fruition. The network awaits its final instruction — and there is only time for one blow before the inevitable unravelling."
 adv_dip_event.148.f: "The intelligence director laid three folders on the desk. \n\n\"The cryptographic bureau: their signal books, within our reach. The flagship: our people are aboard her fitting-out crew. The survey office: every sounding and shore battery on their coastline, ready for copying.\" \n\n\"Choose, sir. The network can deliver one of these. By the time they trace the breach, our people will be gone.\""
 adv_dip_event.148.a: "Take their signal books."
 adv_dip_event.148.b: "Cripple their flagship."
 adv_dip_event.148.c: "Copy the coastal surveys."
 adv_dip_event.149.t: "The Network Unravels"
 adv_dip_event.149.d: "Disaster. [SCOPE.sCountry('naval_intel_target').GetName]'s counterintelligence has rolled up our network — arrests at the dockyard gates, our informants paraded before tribunals, and our name in every foreign newspaper."
 adv_dip_event.149.f: "It began with one arrest — the dockyard clerk, taken quietly at his lodgings. By week's end the arrests numbered forty, and the trials began. \n\nEach informant knew only fragments, but the fragments assembled into an unmistakable whole, and the whole pointed unmistakably at us. Our ambassador endured the summons with what dignity he could muster. \n\nThe network that took years to build was unmade in nine days."
 adv_dip_event.149.a: "A disaster."
